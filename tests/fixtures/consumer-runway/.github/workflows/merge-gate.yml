name: Merge gate

on:
  workflow_dispatch:
    inputs:
      pr:
        description: "Pull request number"
        required: true

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  gate:
    permissions:
      contents: write
      pull-requests: write
      statuses: write
      actions: write
      checks: read
    uses: AnthonyPluth/fleet/.github/workflows/merge-gate.yml@0123456789abcdef0123456789abcdef01234567   # v1.0.0
    with:
      pr: ${{ inputs.pr }}
