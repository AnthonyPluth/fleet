# Dependabot keeps fleet's moving parts up to date with weekly pull requests, as the apps do. Each waits until a
# release is a week old (cooldown): a compromised release is usually caught and pulled within days. Security updates
# for a known vulnerability don't wait.
version: 2
updates:
  # The dev tools (pyproject.toml / poetry.lock). fleet_tools itself has no runtime dependencies.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      python:
        update-types: [minor, patch]   # one PR for routine updates; major versions get their own
    commit-message:
      prefix: deps

  # Actions used by fleet's own workflows and by the reusable workflows the apps call (.github/workflows/)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
