name: Tidy releases

# The reusable tidy-up, run by hand from the app (Actions → Tidy releases → Run workflow) to take back versions that
# shouldn't have been released: each one's GitHub release, its tag and its image in the GitHub Container Registry. It
# can first point floating image tags (:2, :1.0, ...) at other versions, for when a stray release moved them.
#
# Written for 2026-09-30, when an app's main history was rewritten and the release job cut old versions below the
# newest (the apps' docker.yml now steps from the highest version ever tagged, so that can't happen again).
#
# It never deletes the newest version, nor an image still tagged latest or with a floating tag it wasn't asked to move.
# The caller (docs/adopting.md has the snippet) keeps the workflow_dispatch inputs and the concurrency group it shares
# with its docker.yml on main, so it waits for a release in progress. A group holds only one waiting run, and a newer
# one cancels it: before running this, check Actions that no Docker image run is queued on main (this would cancel it,
# and its commits would wait for the next push), and don't push to main while this waits (that cancels it).
on:
  workflow_call:
    inputs:
      image:
        description: The container image in the owner's registry ("waypoint", "runway"), without the owner.
        type: string
        required: true
      versions:
        description: Versions to delete, separated by spaces ("v1.0.2 v2.0.4"); the release, its tag and its image.
        type: string
        required: true
      retag:
        description: Floating image tags to point elsewhere first, as tag=version ("2=2.3.21 1.0=1.0.1").
        type: string
        default: ""
      confirm:
        description: Must be "delete".
        type: string
        required: true
      runs-on:
        description: The runner, as JSON ('"ubuntu-latest"', or a label array). Waypoint passes its vars.RUNS_ON expression.
        type: string
        default: '"ubuntu-latest"'
      fleet-ref:
        description: The fleet ref (the self-test passes its own commit). Nothing of fleet's runs here; kept for the convention every reusable workflow follows.
        type: string
        default: ""

env:
  FLEET_REF: v3.0.0   # stamped by the release

permissions: {}

# bash, which runs each step with -eo pipefail: a failed gh call fails the step instead of passing an empty result on.
defaults:
  run:
    shell: bash

jobs:
  tidy:
    name: Tidy
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 10
    permissions:
      contents: write          # delete releases and tags
      packages: write          # move image tags and delete image versions
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      OWNER: ${{ github.repository_owner }}
      IMAGE: ${{ inputs.image }}
      VERSIONS: ${{ inputs.versions }}
      RETAG: ${{ inputs.retag }}
      CONFIRM: ${{ inputs.confirm }}
    steps:
      - name: Check what's asked
        run: |
          [ "$CONFIRM" = delete ] || { echo "::error::Type delete in the confirm box."; exit 1; }
          [[ "$IMAGE" =~ ^[a-z0-9][a-z0-9._-]*$ ]] || { echo "::error::$IMAGE isn't an image name."; exit 1; }
          highest=$(gh api --paginate "repos/$GH_REPO/tags" --jq '.[].name' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          [ -n "$highest" ] || { echo "::error::Couldn't find the newest version."; exit 1; }
          for v in $VERSIONS; do
            [[ "$v" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::$v isn't a version like v1.2.3."; exit 1; }
            [ "v${v#v}" != "$highest" ] || { echo "::error::$v is the newest version, which is never deleted."; exit 1; }
          done
          for pair in $RETAG; do
            [[ "$pair" =~ ^[0-9]+(\.[0-9]+)?=v?[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::$pair should look like 2=2.3.21."; exit 1; }
            to=${pair#*=}
            for v in $VERSIONS; do
              [ "${v#v}" != "${to#v}" ] || { echo "::error::$pair points at a version being deleted."; exit 1; }
            done
          done
          echo "Deleting: $VERSIONS"; echo "Moving: ${RETAG:-nothing}"

      - name: Point floating image tags elsewhere
        if: inputs.retag != ''
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          img="ghcr.io/${OWNER,,}/$IMAGE"
          for pair in $RETAG; do
            tag=${pair%%=*}; to=${pair#*=}; to=${to#v}
            docker buildx imagetools create -t "$img:$tag" "$img:$to"
            echo "$img:$tag now points at $to"
          done

      - name: Delete the releases and their tags
        run: |
          for v in $VERSIONS; do
            v="v${v#v}"
            if gh release view "$v" >/dev/null 2>&1; then
              gh release delete "$v" --cleanup-tag --yes
              echo "Deleted the release and tag $v"
            elif gh api "repos/$GH_REPO/git/ref/tags/$v" >/dev/null 2>&1; then
              gh api -X DELETE "repos/$GH_REPO/git/refs/tags/$v"
              echo "Deleted the tag $v (it had no release)"
            else
              echo "Nothing named $v"
            fi
          done

      - name: Delete their images
        run: |
          # Each image version with its tags, one per line: id<TAB>tag,tag,...
          images=$(gh api --paginate "users/$OWNER/packages/container/$IMAGE/versions" \
                     --jq '.[] | "\(.id)\t\(.metadata.container.tags | join(","))"')
          for v in $VERSIONS; do
            v=${v#v}
            row=$(awk -F'\t' -v v="$v" '{ n = split($2, t, ","); for (i = 1; i <= n; i++) if (t[i] == v) print }' <<< "$images")
            if [ -z "$row" ]; then echo "No image tagged $v"; continue; fi
            id=${row%%$'\t'*}; tags=${row#*$'\t'}
            # Only its own tags (1.0.2 and v1.0.2): anything else (latest, a floating tag) means it's still in use.
            others=$(tr ',' '\n' <<< "$tags" | grep -vxF -e "$v" -e "v$v" || true)
            if [ -n "$others" ]; then
              echo "::warning::Kept the image for $v: it's also tagged $(tr '\n' ' ' <<< "$others")(move those first)."
              continue
            fi
            gh api -X DELETE "users/$OWNER/packages/container/$IMAGE/versions/$id"
            echo "Deleted the image for $v"
          done
