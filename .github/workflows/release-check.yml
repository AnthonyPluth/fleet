name: Release check

# `fleet release check` on every pull request but Dependabot's (docs/release.md): it adds its changelog fragment
# (changelog.d/<name>.md), every fragment parses, it adds no entry to the frozen CHANGELOG.md and changes no release's
# notes, and its title and description mark it breaking exactly when its fragment is `kind: breaking`, so a breaking
# change can't be titled a minor or a patch, nor a major lack the entry that says what a consumer has to change; a
# `kind: added` fragment needs a `feat:` title (or a breaking one), so an addition can't be titled a patch.
# Dependabot's bumps carry no fragment; a release pull request (it changes VERSION) folds them and adds none.
#
# It runs again when the pull request is edited, so a new title or description is checked too, and apart from fleet
# CI, whose `make check` an edit doesn't start again. It reads the pull request's own tree with a read-only token and
# no secret, on the runner's own python3 (fleet_tools is standard library only); the title and the description reach
# the command through env, as data, never through an expression in the script.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: release-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

# bash, which runs each step with -eo pipefail: a command that fails inside a pipeline fails the step.
defaults:
  run:
    shell: bash

jobs:
  check:
    name: Changelog fragment and title
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest   # hosted: the standard library and git only
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # Two commits deep: HEAD is the pull request merged into its base, and HEAD^1 is that base, which the check
      # diffs against.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      # -E and -s ignore PYTHON* variables and user site-packages (-I would also drop the working directory from
      # sys.path, and with it fleet_tools).
      - name: fleet release check
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: /usr/bin/python3 -E -s -m fleet_tools.cli release check --base 'HEAD^1' --title="$TITLE" --body="$BODY"
