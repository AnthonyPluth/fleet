name: Agent review

# fleet dogfoods its own reusable review (agent-review.yml): this caller declares the triggers, which a called workflow
# can't, and passes the secrets by name. On pull_request_target the caller, and the local workflow it calls, are the
# base branch's copies, so a pull request can't change how it is reviewed. The job grants what the called jobs ask
# for (a called workflow can't be given more than its caller has). fleet has no merge gate caller yet, so none is
# started after the status is set (merge-gate-workflow is empty); the apps keep the default, merge-gate.yml.
on:  # zizmor: ignore[dangerous-triggers] -- runs main's workflow; the pull request's code is only read, never run
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

permissions: {}

jobs:
  review:
    permissions:
      contents: read           # fleet, main's instructions and the pull request's code
      pull-requests: write     # the comment (and the pull request's commits and comments)
      statuses: write          # the "Agent review" status (and the last review's)
      actions: write           # start the merge gate
    uses: ./.github/workflows/agent-review.yml   # zizmor: ignore[self-repository] fleet self-check requires this form
    with:
      budget-usd: ${{ vars.AGENT_REVIEW_BUDGET_USD || '3' }}
      max-turns: ${{ vars.AGENT_REVIEW_MAX_TURNS || '60' }}
      merge-gate-workflow: ""
      second-review-always: |
        .github/workflows/agent-review.yml
        .github/workflows/agent-review-caller.yml
        .github/workflows/cancel-on-close.yml
        .github/workflows/checks.yml
        .github/workflows/deep-scan-due.yml
        .github/workflows/merge-gate.yml
        .github/workflows/merge-gate-threads.yml
        .github/workflows/mining-tasks.yml
        .github/workflows/release.yml
        .github/workflows/review-mining.yml
        .github/workflows/screenshot-diff.yml
        .github/workflows/security.yml
        .github/workflows/sync.yml
        .github/workflows/tidy-releases.yml
        .github/workflows/verify.yml
        .github/scripts/**
        .github/agent-review/**
        .github/CODEOWNERS
        .claude/**
        plugins/**
        shim/**
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
