name: Checks

# The reusable fleet checks (FLEET-SYNC): `fleet checks` over the consumer (with `--commits <base>..<head>` on a pull
# request, so the commit trailers, the removed or skipped tests and the added images are checked too; plain on main)
# and `fleet drift` (the AGENTS.md blocks, the vendored files and .fleet/version against fleet's, and that version
# within the workflow pins). It replaces each app's own `fleet-checks` job. The tools run from a checkout of fleet at
# the version the consumer's content is at (.fleet/version), the same the app's tools/fleet shim runs locally, so
# `fleet drift` compares against the files that version ships; the content may trail the workflow pins within one
# major while a sync pull request (sync.yml) is open. `contents: read` only, no secrets.
#
# The caller (docs/adopting.md has the snippet) keeps the triggers (pull requests and pushes to main) and the
# concurrency group, and passes its runner as `runs-on`.
on:
  workflow_call:
    inputs:
      runs-on:
        description: The runner, as JSON ('"ubuntu-latest"', or a label array). Waypoint passes its vars.RUNS_ON expression.
        type: string
        default: '"ubuntu-latest"'
      working-directory:
        description: The consumer's root within the checkout (the self-test passes a fixture consumer).
        type: string
        default: "."
      expect-drift:
        description: Self-test only. The drift step passes only when `fleet drift` fails.
        type: boolean
        default: false
      fleet-ref:
        description: The fleet ref to run the tools from, in place of the one .fleet/version names (the self-test passes its own commit).
        type: string
        default: ""

env:
  FLEET_REF: main   # stamped by the release

permissions: {}

# bash, which runs each step with -eo pipefail: a command that fails inside a pipeline fails the step.
defaults:
  run:
    shell: bash

jobs:
  checks:
    name: fleet checks
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # The consumer with its history: the pull request's range needs its base and head.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Which fleet to run: the self-test's commit when given, else the version .fleet/version names (checked to be a
      # vX.Y.Z before it reaches the checkout), else this workflow's own ref (fleet drift then reports the missing file).
      - name: The fleet version the content is at
        id: version
        env:
          DIR: ${{ inputs.working-directory }}
          GIVEN: ${{ inputs.fleet-ref }}
        run: |
          ref=$GIVEN
          if [ -z "$ref" ] && [ -f "$DIR/.fleet/version" ]; then
            ref=$(tr -d '[:space:]' < "$DIR/.fleet/version")
            if ! [[ "$ref" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::$DIR/.fleet/version holds '${ref:0:40}', not a version (vX.Y.Z)"
              exit 1
            fi
          fi
          if [ -z "$ref" ]; then
            echo "::warning::No $DIR/.fleet/version: running fleet at $FLEET_REF, whose fleet drift reports the missing file"
            ref=$FLEET_REF
          fi
          echo "ref=$ref" | tee -a "$GITHUB_OUTPUT"

      # fleet at that version: the tools, and the AGENTS.md sections and plugin files fleet drift compares against.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          repository: AnthonyPluth/fleet
          ref: ${{ steps.version.outputs.ref }}
          path: .fleet
          sparse-checkout: |
            fleet_tools
            agents-md
            plugins
            shim
            VERSION
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # The commit range comes from the event, not the pull request's text, and is checked to be two commit ids.
      - name: fleet checks
        env:
          DIR: ${{ inputs.working-directory }}
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          args=()
          if [ "$EVENT" = pull_request ] || [ "$EVENT" = pull_request_target ]; then
            if ! [[ "$BASE" =~ ^[0-9a-f]{40}$ && "$HEAD" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::The pull request's base and head aren't commit ids"
              exit 1
            fi
            args=(--commits "$BASE..$HEAD")
          fi
          root=$(cd "$DIR" && pwd)
          cd .fleet || exit 1
          python3 -E -s -m fleet_tools.cli checks --root "$root" "${args[@]}"

      - name: fleet drift
        env:
          DIR: ${{ inputs.working-directory }}
          EXPECT_DRIFT: ${{ inputs.expect-drift }}
        run: |
          root=$(cd "$DIR" && pwd)
          cd .fleet || exit 1
          if [ "$EXPECT_DRIFT" = true ]; then
            if python3 -E -s -m fleet_tools.cli drift --root "$root"; then
              echo "::error::fleet drift passed on the drifted fixture"
              exit 1
            fi
            echo "fleet drift failed on the drifted fixture, as it should."
            exit 0
          fi
          python3 -E -s -m fleet_tools.cli drift --root "$root"
