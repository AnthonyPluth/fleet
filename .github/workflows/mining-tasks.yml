name: Mining tasks

# Ticked report rows become Agent task issues (FLEET-MINING-TASKS). Each row of the "Repeated review findings" report
# (review-mining.yml) ends with a checkbox, "becomes an Agent task". The owner's tick is the human review step; after
# it, opening the issue is mechanical. On an edit of the report's body, `fleet mining-tasks` reads the report as it is
# now and takes every row that is ticked (`[x]`) and links no issue yet (a tick whose own run was dropped or failed is
# picked up by the next one; a tick withdrawn before the run opens nothing), opens one issue per row in the agent-task
# shape (label `review-mining`, no assignee, a hidden `<!-- mined-from row:<id> -->`) and writes ` → #N` at the end
# of the row's checkbox line. Before opening, it lists the repository's `review-mining` issues (open and closed) and
# links a row whose marker one already carries instead of opening a second. Every piece of the row is defused (no @mentions, no HTML comments, no tags), as the report is.
# `fleet_tools/mining_tasks.py` decides it all; docs/review-mining.md explains the rules.
#
# The caller triggers it on `issues: [edited]`. The job runs only for an issue labelled `review-mining`, opened by
# github-actions[bot], edited by the repository's owner (an edit by anyone else, of any other issue, does nothing),
# and the tool checks the same again. The edits it makes itself use the workflow's token, which starts no workflow.
# No secrets: the workflow's own token, with `issues: write` only. Nothing of the caller's is checked out.
on:
  workflow_call:
    inputs:
      dry-run:
        description: Print the issues and links instead of writing them.
        type: boolean
        default: false
      fixture:
        description: Self-test only. An issues event payload in fleet's checkout, read in place of the real event; implies dry-run.
        type: string
        default: ""
      fleet-ref:
        description: The fleet ref to fetch the tool from (the self-test passes its own commit).
        type: string
        default: ""

env:
  FLEET_REF: v2.1.0   # stamped by the release

permissions: {}

# bash, which runs each step with -eo pipefail: a command that fails inside a pipeline fails the step.
defaults:
  run:
    shell: bash

jobs:
  tasks:
    name: Mining tasks
    if: >-
      inputs.fixture != '' || (
        github.event_name == 'issues' && github.event.action == 'edited'
        && contains(github.event.issue.labels.*.name, 'review-mining')
        && github.event.issue.user.login == 'github-actions[bot]'
        && github.event.sender.login == github.repository_owner
      )
    runs-on: ubuntu-latest   # hosted: holds the write token for the issues; a few API reads and writes
    timeout-minutes: 10
    # One run per report at a time, none cancelled. A third quick edit drops the waiting run, which loses nothing: each
    # run acts on the report as it is then. review-mining.yml's job writes the same body in no shared group (an edit
    # must not drop the scheduled report); both re-read before writing and the mined-from markers restore a lost link.
    concurrency:
      group: mining-tasks-${{ github.event.issue.number || format('fixture-{0}', github.run_id) }}
      cancel-in-progress: false
    permissions:
      issues: write            # open the task issues, list the review-mining ones and link the report's rows
    steps:
      # fleet at the pinned ref: the tool, run from its own checkout. The event fixtures are there for the self-test.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          repository: AnthonyPluth/fleet
          ref: ${{ inputs.fleet-ref || env.FLEET_REF }}
          path: .fleet
          sparse-checkout: |
            fleet_tools
            VERSION
            tests/fixtures/events
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Open the ticked rows' issues
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry-run }}
          FIXTURE: ${{ inputs.fixture }}
        run: |
          flags=()
          event=$GITHUB_EVENT_PATH
          if [ -n "$FIXTURE" ]; then event=$GITHUB_WORKSPACE/.fleet/$FIXTURE; flags+=(--dry-run); fi
          if [ "$DRY_RUN" = true ]; then flags+=(--dry-run); fi
          cd .fleet || exit 1
          python3 -E -s -m fleet_tools.cli mining-tasks --repo "$REPO" --event "$event" "${flags[@]}"
