name: Agent review

# The reusable agent reviews. By default (the owner's policy) only the second review runs, on security-sensitive pull
# requests (below), and every other pull request gets a passing "Second review" saying "Not a risky pull request";
# Codex reviews every pull request, outside this workflow, and the merge gate fails on its open P1 and P2 threads.
# With `first-review: true` an app also gets the first review: an independent review of every pull request an AI agent
# wrote. A fresh Claude Code session, with no access to the session that wrote it, reads the change against main's
# AGENTS.md and the app's .github/agent-review/context.md and posts its findings as a comment. Its verdict is the
# "Agent review" commit status on the pull request's head, which a merge gate that lists it in required-statuses
# requires (merge-gate.yml): a blocking finding fails it, and so does a review that couldn't run. A new push reviews
# again. This is fleet's one copy of the workflow Waypoint and Runway each carried; the parts that differed are inputs
# (docs/agent-review.md, docs/drift.md).
#
# The owner's decisions on models: the first review, where it is on, runs on Sonnet for every agent's pull request, fixed in the Review
# step of the `review` job below (no input changes it; a change is a fleet pull request), so a first review never runs
# on a costlier model. The second review (the `second-review` job, FLEET-SECOND-REVIEW) runs on claude-opus-5-5, fixed
# the same way, on risky pull requests only, as its own "Second review" status. The most a review may spend is the budget-usd input (3 US dollars, as Claude Code estimates a run's cost; second-review-budget-usd, 10, for the second),
# the most round trips to the model max-turns (60; second-review-max-turns, 120); callers pass their
# AGENT_REVIEW_BUDGET_USD and AGENT_REVIEW_MAX_TURNS variables. One that hits either fails as an error (never a pass),
# and each run logs the turns and cost it took, to tune them by.
#
# A pull request is risky when it carries a label in second-review-labels (safety-critical or security by default) or
# changes a path matching second-review-paths (globs with **; second-review-always, by default .github/** and .claude/**, always counts), decided by
# agent_review.py risky from the pull request's labels and files.txt; the comment says which. One that isn't gets a
# passing "Second review" saying "Not a risky pull request", so a merge gate can require the status on every pull
# request. labeled and unlabeled events run only the second review, which re-decides; an unlabeled event sent by anyone
# but the repository owner changes nothing (the job doesn't run, and agent_review.py refuses it too), and a label that
# isn't one of the trigger labels is a skip. A head already reviewed a second time isn't reviewed again on a label
# event. The second review reads main's AGENTS.md, context.md and, when the caller sets second-review-paths, the app's
# .github/agent-review/invariants.md (required then: a risky pull request without it is an error status), plus the
# first review's comment as data; the two reviews run in parallel and neither waits for the other.
#
# The caller (docs/adopting.md has the snippet) declares the triggers, because a called workflow can't:
# pull_request_target on main, for [opened, synchronize, reopened, ready_for_review, labeled, unlabeled], and passes
# the secrets by name (secrets: inherit isn't for cross-owner reuse and would hand over every secret). A re-review
# reads what changed since the last one: the comment's hidden state line records the commit it read and its verdict,
# and when the new head descends from it the reviewer also gets that review's findings and the diff since (in the
# pull request's own files), to check each finding is fixed and read the new lines closely (the whole diff stays in
# front of it, and its findings replace the earlier ones). Without a usable earlier commit (none, rebased away, or
# anything failing) it reviews the whole change. A push that only merges main in is not reviewed again when the last
# review passed: if every commit since it is a merge and the pull request's own change (its diff against where it
# meets main, blob ids included) is byte for byte the one that was reviewed, that "Agent review" verdict is copied to
# the new head, saying so. A blocking or failed review is never carried forward, anything that can't be proved
# identical is reviewed, and the merge gate still requires the status on the head commit itself.
# ready_for_review reviews only when the head has no "Agent review" status yet (a draft already reviewed isn't paid
# for twice); labeled and unlabeled don't run the first review at all (only the second review reacts to them), and the
# concurrency group is the review job's, not the workflow's, so a label event can't cancel a running review.
#
# The diff the reviewer reads leaves out the files the `generated` input names, lockfiles and images (agent_review.py,
# the one list); files.txt and omitted.txt still list them. Fixtures, demo and sample data are never left out unless
# `generated` names them (they are where a real record is likeliest to land), and the prompt has the reviewer read them
# and open every changed image to look for private data: the apps' repositories are public and this review is the
# only check for it. Documentation is always reviewed, for the same reason. Each finding carries a `kind` (the
# AGENTS.md "Mistakes that keep coming back" item it falls under) and the comment's third hidden line carries the
# findings as data, for the monthly mining of repeated findings (FLEET-MINING).
#
# What became of each finding (FLEET-FINDING-OUTCOMES): every finding has an id, the first 8 hex digits of SHA-256 over
# its kind, file and title (lowercased, punctuation removed, whitespace collapsed), shown after its title as `f:1a2b3c4d`
# and carried in the findings line. The comment's fourth hidden line is the outcomes record (agent-review-outcomes,
# base64 JSON; the second review keeps its own under its marker): each id is open while a review reports it, becomes
# resolved when a full review (or an incremental one whose diff touched its file) no longer does, and open again when it
# comes back. The report job merges it (fleet_tools/review_outcomes.py, from fleet's checkout, with the write token:
# it reads only line 4 of the workflow's own previous comment) and reads the owner's dismissals: a conversation
# comment whose first line is `/fleet dismiss f:<id> <reason>` (ten characters of reason at least) from a user whose
# author_association is OWNER; any other association, an unknown id or a malformed command is ignored, and the reason
# is defused like every other quoted text. A dismissal is a record, never an override: it shows in the comment and
# changes no status and no verdict. `fleet review-outcomes --repo OWNER/NAME --pr N` prints the merged outcomes.
#
# The verification record (FLEET-VERIFY-REVIEW): with `verification: true`, when the pull request's description holds a
# record block (the `fleet-verification` markers, FLEET-VERIFY-RECORD), agent_review.py plan extracts it with the
# record parser's block extraction and size limits and writes it to review/verification.md, and the prompt gains the
# section .github/agent-review/verification-review.md, which has the reviewer judge the record against the diff: every
# changed behaviour a dimension, every `verified` row's evidence real, every `not verified` row with a reason, as the
# AGENTS.md kind "Verification that doesn't cover the change". A block that doesn't parse is still written, with a
# first-line note saying so (its format is `fleet checks`' job). The record's text reaches the reviewer only as that
# file, read with its read-only tools, never in the prompt; the description reaches this workflow as an environment
# variable, never in an expression. The comment's state line carries a hash of the record (`record=`), and a re-review
# whose record differs from the last review's rereads it in full (verification-changed.md); an edit to the description
# alone starts no review, the next push picks it up (a merge-only push carries a pass forward only while the record
# is unchanged). The default, `verification: false`, changes nothing.
#
# An agent's pull request is one whose commits carry a Claude-Session or a Claude Co-Authored-By trailer, or whose
# description says Claude Code generated it (fleet_tools/agent_review.py). Anyone else's gets a passing status saying
# so; Dependabot's get none (the merge gate doesn't ask for one).
#
# Why pull_request_target: it runs the caller's main copy of the caller and, through it, fleet's workflow, prompt and
# scripts at the pinned ref, so a pull request can't change how it is reviewed (with pull_request it could edit the
# caller to pass itself). The cost is that the job sees secrets while the pull request's code is checked out, so that
# code is never run, built or installed: it is only read, by a reviewer (.github/scripts/agent-review-run.sh) whose
# only tools are Read, Grep and Glob, confined to the review's directory (no shell, no writing, no network tools, no
# MCP servers), that loads no settings, hooks, skills, plugins or CLAUDE.md (the pull request's included) and holds
# no GitHub token. The secrets appear only in the Review step's env, and that step runs nothing from the pull
# request's checkout. Branches from forks aren't reviewed (that would spend the secret on anyone's pull request): an
# agent's from a fork fails, for a maintainer to push to a branch here. Posting the comment and the status happens in
# the report job, with the write token, which never sees the code or the secrets.
#
# What the review is judged by comes from two trusted checkouts, never the pull request: fleet at the pinned ref
# (the prompt, the answer's schema, the locked Claude Code, the runner script and agent_review.py) and the caller's
# base commit (AGENTS.md and .github/agent-review/context.md, which describes the app and what private data looks like
# there; a consumer without it gets an error status naming the file).
on:
  workflow_call:
    inputs:
      generated:
        description: Paths left out of diff.patch (still listed for the reviewer), one per line. An entry here wins over the rule that fixtures, demo and sample data are always read.
        type: string
        default: ""
      first-review:
        description: Run the first review and post its "Agent review" status and comment. false (the default, the owner's policy) posts neither; true turns it back on for an app that wants it.
        type: boolean
        default: false
      verification:
        description: Give the reviews the pull request's verification record (the `fleet-verification` block of its description) as `verification.md`, to judge against the change. false (the default) leaves the reviews as they were.
        type: boolean
        default: false
      budget-usd:
        description: The most a review may spend, in US dollars as Claude Code estimates it (callers pass their AGENT_REVIEW_BUDGET_USD variable, or '3').
        type: string
        default: "3"
      max-turns:
        description: The most round trips to the model a review may take (callers pass their AGENT_REVIEW_MAX_TURNS variable, or '60').
        type: string
        default: "60"
      second-review-labels:
        description: Labels that make a pull request risky, comma-separated; a risky pull request gets the second review.
        type: string
        default: safety-critical,security
      second-review-paths:
        description: Changed paths that make a pull request risky, one glob per line (`**` spans directories). `.github/**` and `.claude/**` always count. Setting this requires the caller's `.github/agent-review/invariants.md`.
        type: string
        default: ""
      second-review-always:
        description: Changed paths that always make a pull request risky, one glob per line (`**` spans directories). The default is every workflow and agent file (`.github/**` and `.claude/**`); a caller that wants the second review on fewer paths lists them here.
        type: string
        default: |
          .github/**
          .claude/**
      second-review-budget-usd:
        description: The most the second review may spend, in US dollars as Claude Code estimates it.
        type: string
        default: "10"
      second-review-max-turns:
        description: The most round trips to the model the second review may take.
        type: string
        default: "120"
      merge-gate-workflow:
        description: The caller's merge gate workflow file to start once the status is set (setting a status starts none by itself). Empty starts none.
        type: string
        default: merge-gate.yml
      dry-run:
        description: Self-test only. The report job prints the comment and the status instead of posting them and starts no merge gate.
        type: boolean
        default: false
      fake-review:
        description: Self-test only. The answer fleet's stub reviewer (tests/fakes/claude) gives in place of Claude Code, which then isn't installed and needs no secret (pass, advisory, blocking, verification or malformed). Empty runs the real reviewer.
        type: string
        default: ""
      fake-event:
        description: Self-test only, and only with fake-review. The event the second review decides on in place of the real one, as space-separated key=value pairs among action, sender, label, labels (comma-separated) and files (comma-separated, in place of files.txt).
        type: string
        default: ""
      fleet-ref:
        description: The fleet ref to fetch the prompt, scripts and tools from (the self-test passes its own commit).
        type: string
        default: ""
    secrets:
      ANTHROPIC_API_KEY:
        description: An API key to review with. Wins when both secrets are set.
        required: false
      CLAUDE_CODE_OAUTH_TOKEN:
        description: A Claude Pro or Max subscription's token (`claude setup-token`) to review with.
        required: false
    outputs:
      verdict:
        description: pass, blocking, error, or skip (nothing posted); empty when the review job didn't run.
        value: ${{ jobs.review.outputs.verdict }}
      description:
        description: The "Agent review" status description that goes with the verdict.
        value: ${{ jobs.review.outputs.description }}
      record:
        description: A hash of the verification record the first review read; empty when the description has none or `verification` is off.
        value: ${{ jobs.review.outputs.record }}
      second-verdict:
        description: The second review's verdict (pass, blocking, error, or skip); empty when its job didn't run.
        value: ${{ jobs.second-review.outputs.verdict }}
      second-description:
        description: The "Second review" status description that goes with it.
        value: ${{ jobs.second-review.outputs.description }}

env:
  FLEET_REF: v2.4.0   # stamped by the release

permissions: {}

# bash, which runs each step with -eo pipefail: a command that fails inside a pipeline fails the step.
defaults:
  run:
    shell: bash

jobs:
  review:
    name: Review
    # Dependabot's pull requests aren't reviewed, and a label event starts no first review (the job's `if` keeps it out
    # of the concurrency group below, so a running review isn't cancelled by one).
    if: >-
      inputs.first-review &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      !contains(fromJSON('["labeled", "unlabeled"]'), github.event.action)
    runs-on: ubuntu-latest   # hosted: reads untrusted pull request content with secrets in reach
    timeout-minutes: 30
    # A newer push replaces a review still running (github.ref is main's on pull_request_target).
    concurrency:
      group: agent-review-${{ github.event.pull_request.number }}-${{ inputs.fake-review }}
      cancel-in-progress: true
    permissions:
      contents: read           # check out fleet, main's instructions and the pull request's code
      pull-requests: read      # its commits and the last review's comment
      statuses: read           # whether that review passed, and whether this head has one
    outputs:
      verdict: ${{ steps.result.outputs.verdict }}
      description: ${{ steps.result.outputs.description }}
      comment: ${{ steps.result.outputs.comment }}
      findings: ${{ steps.result.outputs.findings }}
      incremental: ${{ steps.plan.outputs.incremental }}
      touched: ${{ steps.plan.outputs.touched }}
      record: ${{ steps.plan.outputs.record }}
    steps:
      # fleet at the pinned ref: the prompt, the schema, the locked Claude Code, the runner script, agent_review.py and
      # the stub reviewer the self-test uses.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          repository: AnthonyPluth/fleet
          ref: ${{ inputs.fleet-ref || env.FLEET_REF }}
          path: .fleet
          sparse-checkout: |
            .github/agent-review
            .github/scripts
            fleet_tools
            tests/fakes
          persist-credentials: false

      # The caller's base commit: its AGENTS.md and .github/agent-review/context.md, what the review is judged by.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          sparse-checkout: .github/agent-review
          persist-credentials: false

      # Whether this is an agent's pull request from this repository, whether this event reviews it (ready_for_review
      # on a head that already has an "Agent review" status doesn't), and whether the caller has a context.md.
      - name: Is this an agent's pull request to review
        id: who
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BODY: ${{ github.event.pull_request.body }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          ACTION: ${{ github.event.action }}
          STUB: ${{ inputs.fake-review }}
        run: |
          agent=$(gh api --paginate "repos/$REPO/pulls/$PR/commits?per_page=100" --jq '.[].commit.message | @json' \
                    | python3 -I .fleet/fleet_tools/agent_review.py detect)
          same_repo=$([ "$HEAD_REPO" = "$REPO" ] && echo true || echo false)
          # Self-test only: the pull request that adds context.md has none on its base yet, so the stub falls back to fleet's own.
          if [ -n "$STUB" ] && [ ! -s trusted/.github/agent-review/context.md ]; then
            mkdir -p trusted/.github/agent-review
            cp .fleet/.github/agent-review/context.md trusted/.github/agent-review/context.md
          fi
          context=$([ -s trusted/.github/agent-review/context.md ] && echo true || echo false)
          statuses=""
          if [ "$ACTION" = ready_for_review ]; then
            statuses=$(gh api --paginate "repos/$REPO/commits/$HEAD/statuses?per_page=100" \
                         --jq '.[] | [.context, .state, .creator.login] | @json')
          fi
          python3 -I .fleet/fleet_tools/agent_review.py wanted "$ACTION" <<< "$statuses" > "$RUNNER_TEMP/wanted.txt"
          review=false
          if [ "$agent" = true ] && [ "$same_repo" = true ] && [ "$context" = true ] && grep -qx 'wanted=true' "$RUNNER_TEMP/wanted.txt"; then
            review=true
          fi
          { echo "agent=$agent"; echo "same_repo=$same_repo"; echo "context=$context"; echo "review=$review"; cat "$RUNNER_TEMP/wanted.txt"; } | tee -a "$GITHUB_OUTPUT"

      # The last review's comment, while no code of the pull request is checked out (this and the step above are the
      # only ones with a token): the commit it read, its findings and whether it passed. If this fails (no outputs),
      # nothing is carried forward, and the review reads the whole change as if it were the first.
      - name: The last review
        id: prev
        if: steps.who.outputs.review == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh api --paginate "repos/$REPO/issues/$PR/comments?per_page=100" \
            --jq '.[] | select(.user.login == "github-actions[bot]") | .body | @json' > "$RUNNER_TEMP/comments.jsonl"
          read -r sha verdict record < <(python3 -I .fleet/fleet_tools/agent_review.py previous \
                                           "$RUNNER_TEMP/comments.jsonl" "$RUNNER_TEMP/previous-review.md") || true
          # The newest "Agent review" status on the commit it read, if this workflow set it (newest first).
          state=""
          if [[ "${sha:-}" =~ ^[0-9a-f]{40}$ ]]; then
            state=$(gh api --paginate "repos/$REPO/commits/$sha/statuses?per_page=100" \
                      --jq '.[] | select(.context == "Agent review") | [.state, .creator.login] | @tsv' \
                    | awk -F'\t' 'NR == 1 && $2 == "github-actions[bot]" { print $1 }')
          fi
          { echo "sha=${sha:-}"; echo "verdict=${verdict:-}"; echo "state=$state"; echo "record=${record:-}"; } | tee -a "$GITHUB_OUTPUT"

      # The pull request's code, to read only: nothing in it is run.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        if: steps.who.outputs.review == 'true'
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0       # main's history too, for the diff against where it branched
          path: review/pr

      # Beside it in review/: the prompt, the schema of the answer, AGENTS.md and context.md; and the change itself,
      # with the last review's findings and what changed since when it read an earlier commit of this one
      # (agent_review.py plan, which only reads the checkout with git: no hooks, no external diff or textconv drivers).
      - name: Gather the change
        id: plan
        if: steps.who.outputs.review == 'true'
        env:
          MAIN: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          PREV_SHA: ${{ steps.prev.outputs.sha }}
          PREV_VERDICT: ${{ steps.prev.outputs.verdict }}
          PREV_STATE: ${{ steps.prev.outputs.state }}
          GENERATED: ${{ inputs.generated }}
          VERIFICATION: ${{ inputs.verification }}
          BODY: ${{ github.event.pull_request.body }}
          PREV_RECORD: ${{ steps.prev.outputs.record }}
          REPO_DIR: review/pr
          OUT_DIR: review
          TRUSTED: .fleet/.github/agent-review
        run: |
          cp trusted/AGENTS.md trusted/.github/agent-review/context.md \
             .fleet/.github/agent-review/prompt.md .fleet/.github/agent-review/schema.json review/
          if [ -n "$PREV_SHA" ] && [ -s "$RUNNER_TEMP/previous-review.md" ]; then export PREV_BODY="$RUNNER_TEMP/previous-review.md"; fi
          python3 -I .fleet/fleet_tools/agent_review.py plan
          echo "$(wc -l < review/files.txt) file(s), $(wc -l < review/diff.patch) diff line(s), $(wc -l < review/omitted.txt) left out"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1   # v7.1.0
        if: steps.plan.outputs.mode == 'review' && inputs.fake-review == ''
        with:
          node-version-file: .fleet/.github/agent-review/package.json
          package-manager-cache: false

      # At the version fleet's .github/agent-review/package-lock.json locks, installed in $RUNNER_TEMP, outside every
      # checkout and none of their parents (so no .npmrc of the pull request's applies). Only when a review runs.
      - name: Install Claude Code
        if: steps.plan.outputs.mode == 'review' && inputs.fake-review == ''
        run: |
          mkdir -p "$RUNNER_TEMP/claude-code"
          cp .fleet/.github/agent-review/package.json .fleet/.github/agent-review/package-lock.json "$RUNNER_TEMP/claude-code/"
          cd "$RUNNER_TEMP/claude-code"
          npm ci --no-audit --no-fund
          node_modules/.bin/claude --version

      # The reviewer, in review/ (fleet's script; see it for how it is isolated), with whichever secret is set. The
      # only step that holds a secret; it runs nothing from the pull request's checkout, and the script replaces an
      # answer that quotes the secret with an error before the Verdict step reads it.
      - name: Review
        id: review
        if: steps.plan.outputs.mode == 'review' && inputs.fake-review == ''
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE: ${{ runner.temp }}/claude-code/node_modules/.bin/claude
          MODEL: sonnet
          BUDGET: ${{ inputs.budget-usd }}
          MAX_TURNS: ${{ inputs.max-turns }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ] && [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::error::No CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY secret to review with."
            echo "secret=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "secret=true" >> "$GITHUB_OUTPUT"
          cd review
          ../.fleet/.github/scripts/agent-review-run.sh

      # The self-test's stand-in for the step above: fleet's stub reviewer, the same script, no secret.
      - name: Review with the stub reviewer (self-test)
        if: steps.plan.outputs.mode == 'review' && inputs.fake-review != ''
        env:
          ANTHROPIC_API_KEY: not-a-key-the-stub-reviewer-reads-none
          CLAUDE: ${{ github.workspace }}/.fleet/tests/fakes/claude
          FAKE_REVIEW: ${{ inputs.fake-review }}
          MODEL: sonnet
          BUDGET: ${{ inputs.budget-usd }}
          MAX_TURNS: ${{ inputs.max-turns }}
        run: |
          cd review
          ../.fleet/.github/scripts/agent-review-run.sh

      - name: Verdict
        id: result
        env:
          AGENT: ${{ steps.who.outputs.agent }}
          SAME_REPO: ${{ steps.who.outputs.same_repo }}
          CONTEXT: ${{ steps.who.outputs.context }}
          WANTED: ${{ steps.who.outputs.wanted }}
          REASON: ${{ steps.who.outputs.reason }}
          MODE: ${{ steps.plan.outputs.mode }}
          PLANNED: ${{ steps.plan.outputs.description }}
          SECRET: ${{ steps.review.outputs.secret }}
          STUB: ${{ inputs.fake-review }}
          REVIEWED_SHA: ${{ github.event.pull_request.head.sha }}   # in the comment, for the next push's re-review
          RECORD_HASH: ${{ steps.plan.outputs.record }}            # beside it: the verification record this review read
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$WANTED" != true ]; then
            { echo "verdict=skip"; echo "description=$REASON"; echo "comment="; } >> "$GITHUB_OUTPUT"
          elif [ "$AGENT" != true ]; then
            { echo "verdict=pass"; echo "description=Not an agent's pull request"; echo "comment="; } >> "$GITHUB_OUTPUT"
          elif [ "$SAME_REPO" != true ]; then
            { echo "verdict=error"; echo "description=Agents' pull requests are reviewed only from this repository's branches"; echo "comment="; } >> "$GITHUB_OUTPUT"
          elif [ "$CONTEXT" != true ]; then
            { echo "verdict=error"; echo "description=No .github/agent-review/context.md on main to review against"; echo "comment="; } >> "$GITHUB_OUTPUT"
          elif [ "$MODE" = carry ]; then
            # The last review's comment stays as it is: it, and its state line, describe the commit it read.
            { echo "verdict=pass"; echo "description=$PLANNED"; echo "comment="; } >> "$GITHUB_OUTPUT"
          elif [ -z "$STUB" ] && [ "$SECRET" != true ]; then
            { echo "verdict=error"; echo "description=No CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY secret to review with"; echo "comment="; } >> "$GITHUB_OUTPUT"
          else
            python3 -I .fleet/fleet_tools/agent_review.py report review/output.json
          fi

  # Posts what the review found: the comment, the "Agent review" status, and asks the merge gate to decide again
  # (setting a status starts no workflow by itself). It never sees the pull request's code or the secrets; it checks
  # out fleet's tools alone, for the finding outcomes (line 4 of the comment, and the owner's dismissals). With
  # dry-run it prints what it would post. A skip (a label event, a draft already reviewed) posts nothing.
  report:
    name: Report
    needs: review
    if: >-
      !cancelled() && inputs.first-review &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      !contains(fromJSON('["labeled", "unlabeled"]'), github.event.action)
    runs-on: ubuntu-latest   # hosted: holds the write token for the comment and the status
    timeout-minutes: 5
    permissions:
      contents: read           # check out fleet's tools
      pull-requests: write     # the comment (and the dismissals among the pull request's comments)
      statuses: write          # the "Agent review" status
      actions: write           # start the merge gate
    steps:
      # fleet's tools at the pinned ref, for the finding outcomes (review_outcomes.py); nothing of the pull request.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          repository: AnthonyPluth/fleet
          ref: ${{ inputs.fleet-ref || env.FLEET_REF }}
          path: .fleet
          sparse-checkout: fleet_tools
          persist-credentials: false
      - name: Post the review
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          RESULT: ${{ needs.review.result }}
          VERDICT: ${{ needs.review.outputs.verdict }}
          DESCRIPTION: ${{ needs.review.outputs.description }}
          COMMENT: ${{ needs.review.outputs.comment }}
          FINDINGS: ${{ needs.review.outputs.findings }}
          INCREMENTAL: ${{ needs.review.outputs.incremental }}
          TOUCHED: ${{ needs.review.outputs.touched }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MERGE_GATE: ${{ inputs.merge-gate-workflow }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          run() { if [ "$DRY_RUN" = true ]; then echo "(dry run) $*"; else "$@" > /dev/null; fi; }
          case "$RESULT:$VERDICT" in
            success:skip) echo "Nothing to post: $DESCRIPTION"; exit 0 ;;
            success:pass) state=success ;;
            success:blocking) state=failure ;;
            *) state=error; [ -n "$DESCRIPTION" ] || DESCRIPTION="The review didn't finish; see the run" ;;
          esac
          echo "$state: $DESCRIPTION"
          if [ -n "$COMMENT" ]; then
            base64 -d <<< "$COMMENT" > comment.md
            # The finding outcomes: line 4 merged from the last comment's record and every finding of this review (the
            # findings output, since line 3 is cut to fit), and the owner's dismissals shown. If this fails the comment is posted as it is (a warning says so).
            base64 -d <<< "$TOUCHED" > touched.txt
            base64 -d <<< "$FINDINGS" > findings.json
            python3 -I .fleet/fleet_tools/review_outcomes.py --finish comment.md --repo "$REPO" --pr "$PR" --sha "$SHA" \
              --incremental "$INCREMENTAL" --touched touched.txt --findings findings.json
            if [ "$DRY_RUN" = true ]; then echo "(dry run) the comment:"; cat comment.md; echo; fi
            # One comment per pull request, updated by each review (the marker is its first line).
            existing=$(gh api --paginate "repos/$REPO/issues/$PR/comments?per_page=100" \
                         --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- agent-review -->"))) | .id')
            existing=${existing%%$'\n'*}
            if [ -n "$existing" ]; then
              run gh api -X PATCH "repos/$REPO/issues/comments/$existing" -F body=@comment.md
            else
              run gh api -X POST "repos/$REPO/issues/$PR/comments" -F body=@comment.md
            fi
          fi
          run gh api -X POST "repos/$REPO/statuses/$SHA" -f state="$state" -f context="Agent review" \
            -f description="${DESCRIPTION:0:140}" -f target_url="$RUN_URL"
          if [ -n "$MERGE_GATE" ]; then
            run gh workflow run "$MERGE_GATE" --repo "$REPO" --ref main -f pr="$PR"
          fi

  # Before a label event's second review (FLEET-SECOND-REVIEW): a head that was reviewed before the label came may
  # already carry a passing "Second review" and a passing "Merge gate", and the review below can take a while, so
  # this job first sets "Second review" to pending on the head and asks the merge gate to decide again. The gate then
  # waits for the verdict second-report posts (a review that fails or errors still gets a final state from it), and
  # the pull request can't merge on the old status while the review runs. Only when the review will run: not for a
  # label the review doesn't react to, nor for a head already reviewed a second time (agent_review.py wanted, the same
  # decision second-review makes). It holds the write token and never sees the pull request's code or the secrets.
  second-pending:
    name: Second review pending
    if: >-
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      !(github.event.action == 'unlabeled' && github.event.sender.login != github.repository_owner) &&
      (contains(fromJSON('["labeled", "unlabeled"]'), github.event.action) || inputs.fake-review != '' && inputs.fake-event != '')
    runs-on: ubuntu-latest   # hosted: holds the write token for the status
    timeout-minutes: 5
    permissions:
      contents: read           # check out fleet's tools
      statuses: write          # the pending "Second review" status (and reading the head's)
      actions: write           # start the merge gate
    outputs:
      event-class: ${{ steps.class.outputs.class }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          repository: AnthonyPluth/fleet
          ref: ${{ inputs.fleet-ref || env.FLEET_REF }}
          path: .fleet
          sparse-checkout: fleet_tools
          persist-credentials: false
      # Which concurrency group second-review joins on a label event (push, label or other-label), decided here because
      # an expression can't trim: the label is matched against second-review-labels as split_list() splits them, the
      # same match `wanted` makes. An event this step didn't classify gets a group of its own run (it cancels nothing).
      - name: Classify the event for the second review's concurrency group
        id: class
        env:
          ACTION: ${{ github.event.action }}
          LABEL: ${{ github.event.label.name }}
          TRIGGER_LABELS: ${{ inputs.second-review-labels }}
        run: python3 -I .fleet/fleet_tools/agent_review.py second event-class
      - name: Mark the second review pending while it runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          ACTION: ${{ github.event.action }}
          SENDER: ${{ github.event.sender.login }}
          OWNER: ${{ github.repository_owner }}
          LABEL: ${{ github.event.label.name }}
          TRIGGER_LABELS: ${{ inputs.second-review-labels }}
          FAKE_EVENT: ${{ inputs.fake-review != '' && inputs.fake-event || '' }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MERGE_GATE: ${{ inputs.merge-gate-workflow }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          run() { if [ "$DRY_RUN" = true ]; then echo "(dry run) $*"; else "$@" > /dev/null; fi; }
          read_statuses() {
            gh api --paginate "repos/$REPO/commits/$SHA/statuses?per_page=100" \
              --jq '.[] | [.context, .state, .creator.login, (.description // ""), (.target_url // "")] | @json'
          }
          # The runs a "Second review" status (or the comment) names, looked up: only a run of this same workflow, event and
          # head repository whose head_sha is this head and whose pull_requests lists this pull request (or, once GitHub has
          # emptied that list, whose head_branch is its branch) counts (agent_review.py trusted); anything else, or a run that
          # can't be looked up, counts for nothing.
          look_up_runs() {
            : > "$RUNNER_TEMP/runs.jsonl"
            for id in $(python3 -I .fleet/fleet_tools/agent_review.py second runs "$RUNNER_TEMP/comments.jsonl" <<< "$1"); do
              gh api "repos/$REPO/actions/runs/$id" --jq '[.id, .workflow_id, .event, .head_sha, .head_branch, .head_repository.full_name, [.pull_requests[].number], .status] | @json' \
                >> "$RUNNER_TEMP/runs.jsonl" 2> /dev/null || echo "Run $id couldn't be looked up: its statuses count for nothing."
            done
          }
          # After posting, a status another run wrote meanwhile is put right: the decided one goes back on top.
          settle() {
            for _ in 1 2 3; do
              statuses=$(read_statuses)
              look_up_runs "$statuses"
              mapfile -t restore < <(python3 -I .fleet/fleet_tools/agent_review.py second settle "$SHA" "$RUNNER_TEMP/runs.jsonl" <<< "$statuses")
              [ "${#restore[@]}" -eq 3 ] || break
              echo "Another status was set on this head meanwhile: posting the decided ${restore[0]} again."
              run gh api -X POST "repos/$REPO/statuses/$SHA" -f state="${restore[0]}" -f context="Second review" \
                -f description="${restore[2]:0:140}" -f target_url="${restore[1]}"
              [ "$DRY_RUN" != true ] || break
            done
          }
          SHA=$HEAD
          : > "$RUNNER_TEMP/comments.jsonl"
          statuses=$(read_statuses)
          python3 -I .fleet/fleet_tools/agent_review.py second wanted "$ACTION" <<< "$statuses" | tee "$RUNNER_TEMP/wanted.txt"
          if ! grep -qx 'pending=true' "$RUNNER_TEMP/wanted.txt"; then
            echo "No second review will run on this event; the status stays as it is."
            exit 0
          fi
          # Which run decides the head's "Second review" (docs/agent-review.md, "Which run decides").
          look_up_runs "$statuses"
          DESCRIPTION="A second review is running after a label change"
          export DESCRIPTION
          python3 -I .fleet/fleet_tools/agent_review.py second publish "$SHA" "$RUNNER_TEMP/runs.jsonl" "$RUNNER_TEMP/comments.jsonl" pending \
            <<< "$statuses" | tee "$RUNNER_TEMP/publish.txt"
          if grep -qx 'status=' "$RUNNER_TEMP/publish.txt"; then
            echo "A run that started after this one has set this head's \"Second review\"; it stays as it is."
            exit 0
          fi
          run gh api -X POST "repos/$REPO/statuses/$SHA" -f state=pending -f context="Second review" \
            -f description="$DESCRIPTION" -f target_url="$RUN_URL"
          settle
          if [ -n "$MERGE_GATE" ]; then
            run gh workflow run "$MERGE_GATE" --repo "$REPO" --ref main -f pr="$PR"
          fi

  # The second review, on risky pull requests only (FLEET-SECOND-REVIEW): the same shape as `review`, isolated the same
  # way (read-only tools confined to its directory, no settings, hooks, plugins or MCP servers, a hosted runner, the
  # secrets only in its Review step), on claude-opus-5-5 with its own budget and turns, its own comment (marker
  # <!-- second-review -->, its own state and findings lines) and its own "Second review" status, posted by
  # second-report. It runs on label events too, which `review` ignores; an unlabeled event from anyone but the
  # repository owner never starts it. Its concurrency group is the job's and tells label events apart from pushes, so
  # a label event can't cancel a running review of a push (two label events replace each other: the later state wins);
  # whether a label is a trigger label comes from second-pending's event-class output, matched as split_list() splits.
  # On a label event it runs after second-pending, which marks the head's "Second review" pending first.
  second-review:
    name: Second review
    needs: second-pending   # the pending status goes up first; skipped or failed, the review still runs
    if: >-
      !cancelled() &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      !(github.event.action == 'unlabeled' && github.event.sender.login != github.repository_owner)
    runs-on: ubuntu-latest   # hosted: reads untrusted pull request content with secrets in reach
    timeout-minutes: 45
    concurrency:
      group: second-review-${{ github.event.pull_request.number }}-${{ inputs.fake-review }}-${{ inputs.fake-event }}-${{ !contains(fromJSON('["labeled", "unlabeled"]'), github.event.action) && 'push' || needs.second-pending.outputs.event-class || format('unknown-{0}', github.run_id) }}
      cancel-in-progress: true
    permissions:
      contents: read           # check out fleet, main's instructions and the pull request's code
      pull-requests: read      # its commits and the reviews' comments
      statuses: read           # whether the last second review passed, and whether this head has one
    outputs:
      verdict: ${{ steps.result.outputs.verdict }}
      description: ${{ steps.result.outputs.description }}
      comment: ${{ steps.result.outputs.comment }}
      findings: ${{ steps.result.outputs.findings }}
      incremental: ${{ steps.plan.outputs.incremental }}
      touched: ${{ steps.plan.outputs.touched }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          repository: AnthonyPluth/fleet
          ref: ${{ inputs.fleet-ref || env.FLEET_REF }}
          path: .fleet
          sparse-checkout: |
            .github/agent-review
            .github/scripts
            fleet_tools
            tests/fakes
          persist-credentials: false

      # The caller's base commit: AGENTS.md, context.md and invariants.md, what the second review is judged by.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          sparse-checkout: .github/agent-review
          persist-credentials: false

      # Whether this is an agent's pull request from this repository, whether this event decides the second review (a
      # label event with a label the review doesn't react to, or a removal by someone other than the owner, doesn't;
      # ready_for_review doesn't on a head that already has a "Second review" status), and whether the caller has a
      # context.md and, when it sets second-review-paths, an invariants.md. The labels and the sender are data: read
      # from the event into variables and compared in Python, never in a shell expression.
      - name: Is this an agent's pull request to review a second time
        id: who
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BODY: ${{ github.event.pull_request.body }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          ACTION: ${{ github.event.action }}
          SENDER: ${{ github.event.sender.login }}
          OWNER: ${{ github.repository_owner }}
          LABEL: ${{ github.event.label.name }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          TRIGGER_LABELS: ${{ inputs.second-review-labels }}
          RISKY_PATHS: ${{ inputs.second-review-paths }}
          ALWAYS_PATHS: ${{ inputs.second-review-always }}
          STUB: ${{ inputs.fake-review }}
          FAKE_EVENT: ${{ inputs.fake-review != '' && inputs.fake-event || '' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          agent=$(gh api --paginate "repos/$REPO/pulls/$PR/commits?per_page=100" --jq '.[].commit.message | @json' \
                    | python3 -I .fleet/fleet_tools/agent_review.py detect)
          same_repo=$([ "$HEAD_REPO" = "$REPO" ] && echo true || echo false)
          # Self-test only: the pull request that adds context.md or invariants.md has none on its base yet, so the stub falls back to fleet's own.
          if [ -n "$STUB" ]; then
            mkdir -p trusted/.github/agent-review
            for name in context.md invariants.md; do
              [ -s "trusted/.github/agent-review/$name" ] || cp ".fleet/.github/agent-review/$name" "trusted/.github/agent-review/$name"
            done
          fi
          context=$([ -s trusted/.github/agent-review/context.md ] && echo true || echo false)
          invariants=true
          if [ -n "$(tr -d '[:space:]' <<< "$RISKY_PATHS")" ] && [ ! -s trusted/.github/agent-review/invariants.md ]; then invariants=false; fi
          statuses=""
          if [ "$ACTION" = ready_for_review ] || [ "$ACTION" = labeled ] || [ "$ACTION" = unlabeled ]; then
            # With each status's link: a re-run's own earlier verdict doesn't count as the head already reviewed.
            statuses=$(gh api --paginate "repos/$REPO/commits/$HEAD/statuses?per_page=100" \
                         --jq '.[] | [.context, .state, .creator.login, (.description // ""), (.target_url // "")] | @json')
          fi
          python3 -I .fleet/fleet_tools/agent_review.py second wanted "$ACTION" <<< "$statuses" > "$RUNNER_TEMP/wanted.txt"
          review=false
          if [ "$agent" = true ] && [ "$same_repo" = true ] && [ "$context" = true ] && grep -qx 'wanted=true' "$RUNNER_TEMP/wanted.txt"; then
            review=true
          fi
          { echo "agent=$agent"; echo "same_repo=$same_repo"; echo "context=$context"; echo "invariants=$invariants"; echo "review=$review"; cat "$RUNNER_TEMP/wanted.txt"; } | tee -a "$GITHUB_OUTPUT"

      # The last second review's comment (its marker, its state line) and the first review's comment, as data for the
      # reviewer, while no code of the pull request is checked out. If this fails (no outputs), nothing is carried
      # forward and the review reads the whole change.
      - name: The last reviews
        id: prev
        if: steps.who.outputs.review == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh api --paginate "repos/$REPO/issues/$PR/comments?per_page=100" \
            --jq '.[] | select(.user.login == "github-actions[bot]") | .body | @json' > "$RUNNER_TEMP/comments.jsonl"
          python3 -I .fleet/fleet_tools/agent_review.py previous "$RUNNER_TEMP/comments.jsonl" "$RUNNER_TEMP/first-review.md" > /dev/null || true
          read -r sha verdict record < <(python3 -I .fleet/fleet_tools/agent_review.py second previous \
                                           "$RUNNER_TEMP/comments.jsonl" "$RUNNER_TEMP/previous-review.md") || true
          # The newest "Second review" status on the commit it read, if this workflow set it (newest first).
          state=""
          if [[ "${sha:-}" =~ ^[0-9a-f]{40}$ ]]; then
            state=$(gh api --paginate "repos/$REPO/commits/$sha/statuses?per_page=100" \
                      --jq '.[] | select(.context == "Second review") | [.state, .creator.login] | @tsv' \
                    | awk -F'\t' 'NR == 1 && $2 == "github-actions[bot]" { print $1 }')
          fi
          { echo "sha=${sha:-}"; echo "verdict=${verdict:-}"; echo "state=$state"; echo "record=${record:-}"; } | tee -a "$GITHUB_OUTPUT"

      # The pull request's code, to read only: nothing in it is run.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        if: steps.who.outputs.review == 'true'
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0       # main's history too, for the diff against where it branched
          path: review/pr

      # Beside it in review/: the prompt with second-review.md appended, the schema, AGENTS.md, context.md, invariants.md
      # and the first review's comment when there are any; and the change itself, as for the first review.
      - name: Gather the change
        id: plan
        if: steps.who.outputs.review == 'true'
        env:
          MAIN: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          PREV_SHA: ${{ steps.prev.outputs.sha }}
          PREV_VERDICT: ${{ steps.prev.outputs.verdict }}
          PREV_STATE: ${{ steps.prev.outputs.state }}
          GENERATED: ${{ inputs.generated }}
          VERIFICATION: ${{ inputs.verification }}
          BODY: ${{ github.event.pull_request.body }}
          PREV_RECORD: ${{ steps.prev.outputs.record }}
          REPO_DIR: review/pr
          OUT_DIR: review
          TRUSTED: .fleet/.github/agent-review
        run: |
          cp trusted/AGENTS.md trusted/.github/agent-review/context.md \
             .fleet/.github/agent-review/prompt.md .fleet/.github/agent-review/schema.json review/
          [ ! -s trusted/.github/agent-review/invariants.md ] || cp trusted/.github/agent-review/invariants.md review/
          [ ! -s "$RUNNER_TEMP/first-review.md" ] || cp "$RUNNER_TEMP/first-review.md" review/
          if [ -n "$PREV_SHA" ] && [ -s "$RUNNER_TEMP/previous-review.md" ]; then export PREV_BODY="$RUNNER_TEMP/previous-review.md"; fi
          python3 -I .fleet/fleet_tools/agent_review.py second plan
          echo "$(wc -l < review/files.txt) file(s), $(wc -l < review/diff.patch) diff line(s), $(wc -l < review/omitted.txt) left out"

      # Risky or not, from the labels and files.txt (agent_review.py risky); the reason goes to the reviewer and the comment.
      - name: Is it risky
        id: risky
        if: steps.who.outputs.review == 'true'
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          TRIGGER_LABELS: ${{ inputs.second-review-labels }}
          RISKY_PATHS: ${{ inputs.second-review-paths }}
          ALWAYS_PATHS: ${{ inputs.second-review-always }}
          FAKE_EVENT: ${{ inputs.fake-review != '' && inputs.fake-event || '' }}
        run: python3 -I .fleet/fleet_tools/agent_review.py second risky review/files.txt review/reason.txt

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1   # v7.1.0
        if: steps.plan.outputs.mode == 'review' && steps.risky.outputs.risky == 'true' && steps.who.outputs.invariants == 'true' && inputs.fake-review == ''
        with:
          node-version-file: .fleet/.github/agent-review/package.json
          package-manager-cache: false

      - name: Install Claude Code
        if: steps.plan.outputs.mode == 'review' && steps.risky.outputs.risky == 'true' && steps.who.outputs.invariants == 'true' && inputs.fake-review == ''
        run: |
          mkdir -p "$RUNNER_TEMP/claude-code"
          cp .fleet/.github/agent-review/package.json .fleet/.github/agent-review/package-lock.json "$RUNNER_TEMP/claude-code/"
          cd "$RUNNER_TEMP/claude-code"
          npm ci --no-audit --no-fund
          node_modules/.bin/claude --version

      # The second reviewer, on claude-opus-5-5 (fixed here: no input changes it), with the second review's budget and
      # turns, in review/ with fleet's script. The only step in this job that holds a secret; it runs nothing from the
      # pull request's checkout, and the script replaces an answer that quotes the secret with an error.
      - name: Review
        id: review
        if: steps.plan.outputs.mode == 'review' && steps.risky.outputs.risky == 'true' && steps.who.outputs.invariants == 'true' && inputs.fake-review == ''
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE: ${{ runner.temp }}/claude-code/node_modules/.bin/claude
          MODEL: claude-opus-5-5
          BUDGET: ${{ inputs.second-review-budget-usd }}
          MAX_TURNS: ${{ inputs.second-review-max-turns }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ] && [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::error::No CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY secret to review with."
            echo "secret=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "secret=true" >> "$GITHUB_OUTPUT"
          cd review
          ../.fleet/.github/scripts/agent-review-run.sh

      - name: Review with the stub reviewer (self-test)
        if: steps.plan.outputs.mode == 'review' && steps.risky.outputs.risky == 'true' && steps.who.outputs.invariants == 'true' && inputs.fake-review != ''
        env:
          ANTHROPIC_API_KEY: not-a-key-the-stub-reviewer-reads-none
          CLAUDE: ${{ github.workspace }}/.fleet/tests/fakes/claude
          FAKE_REVIEW: ${{ inputs.fake-review }}
          MODEL: claude-opus-5-5
          BUDGET: ${{ inputs.second-review-budget-usd }}
          MAX_TURNS: ${{ inputs.second-review-max-turns }}
        run: |
          cd review
          ../.fleet/.github/scripts/agent-review-run.sh

      - name: Verdict
        id: result
        env:
          AGENT: ${{ steps.who.outputs.agent }}
          SAME_REPO: ${{ steps.who.outputs.same_repo }}
          CONTEXT: ${{ steps.who.outputs.context }}
          INVARIANTS: ${{ steps.who.outputs.invariants }}
          WANTED: ${{ steps.who.outputs.wanted }}
          REASON: ${{ steps.who.outputs.reason }}
          REVIEWED: ${{ steps.who.outputs.reviewed }}
          LABEL_EVENT: ${{ contains(fromJSON('["labeled", "unlabeled"]'), github.event.action) }}
          MODE: ${{ steps.plan.outputs.mode }}
          PLANNED: ${{ steps.plan.outputs.description }}
          RISKY: ${{ steps.risky.outputs.risky }}
          RISKY_REASON: ${{ steps.risky.outputs.reason }}
          SECRET: ${{ steps.review.outputs.secret }}
          STUB: ${{ inputs.fake-review }}
          REVIEWED_SHA: ${{ github.event.pull_request.head.sha }}   # in the comment, for the next push's re-review
          RECORD_HASH: ${{ steps.plan.outputs.record }}            # beside it: the verification record this review read
          RUN_ID: ${{ github.run_id }}                              # and its run, which orders the runs on one head
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$WANTED" != true ]; then
            { echo "verdict=skip"; echo "description=$REASON"; echo "comment="; } >> "$GITHUB_OUTPUT"
          elif [ "$AGENT" != true ]; then
            { echo "verdict=pass"; echo "description=Not an agent's pull request"; echo "comment="; } >> "$GITHUB_OUTPUT"
          elif [ "$SAME_REPO" != true ]; then
            { echo "verdict=error"; echo "description=Agents' pull requests are reviewed only from this repository's branches"; echo "comment="; } >> "$GITHUB_OUTPUT"
          elif [ "$CONTEXT" != true ]; then
            { echo "verdict=error"; echo "description=No .github/agent-review/context.md on main to review against"; echo "comment="; } >> "$GITHUB_OUTPUT"
          elif [ "$RISKY" != true ]; then
            { echo "verdict=pass"; echo "description=$RISKY_REASON"; echo "comment="; } >> "$GITHUB_OUTPUT"
          elif [ "$LABEL_EVENT" = true ] && [ "$REVIEWED" = true ]; then
            # A label event on a head already reviewed a second time: that review and its status stand.
            { echo "verdict=skip"; echo "description=Already reviewed a second time at this commit"; echo "comment="; } >> "$GITHUB_OUTPUT"
          elif [ "$INVARIANTS" != true ]; then
            { echo "verdict=error"; echo "description=No .github/agent-review/invariants.md on main; second-review-paths requires it"; echo "comment="; } >> "$GITHUB_OUTPUT"
          elif [ "$MODE" = carry ]; then
            { echo "verdict=pass"; echo "description=$PLANNED"; echo "comment="; } >> "$GITHUB_OUTPUT"
          elif [ -z "$STUB" ] && [ "$SECRET" != true ]; then
            { echo "verdict=error"; echo "description=No CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY secret to review with"; echo "comment="; } >> "$GITHUB_OUTPUT"
          else
            python3 -I .fleet/fleet_tools/agent_review.py second report review/output.json
          fi

  # Posts the second review: its comment (found again by its own marker) and the "Second review" status, and asks the
  # merge gate to decide again. Like `report`, it never sees the pull request's code or the secrets, and a skip posts
  # nothing, so an event that changes nothing leaves the status as it was.
  second-report:
    name: Second report
    needs: second-review
    if: >-
      !cancelled() &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      !(github.event.action == 'unlabeled' && github.event.sender.login != github.repository_owner)
    runs-on: ubuntu-latest   # hosted: holds the write token for the comment and the status
    timeout-minutes: 5
    permissions:
      contents: read           # check out fleet's tools
      pull-requests: write     # the comment (and the dismissals among the pull request's comments)
      statuses: write          # the "Second review" status
      actions: write           # start the merge gate
    steps:
      # fleet's tools at the pinned ref, for the finding outcomes (review_outcomes.py); nothing of the pull request.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          repository: AnthonyPluth/fleet
          ref: ${{ inputs.fleet-ref || env.FLEET_REF }}
          path: .fleet
          sparse-checkout: fleet_tools
          persist-credentials: false
      - name: Post the second review
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          RESULT: ${{ needs.second-review.result }}
          VERDICT: ${{ needs.second-review.outputs.verdict }}
          DESCRIPTION: ${{ needs.second-review.outputs.description }}
          COMMENT: ${{ needs.second-review.outputs.comment }}
          FINDINGS: ${{ needs.second-review.outputs.findings }}
          INCREMENTAL: ${{ needs.second-review.outputs.incremental }}
          TOUCHED: ${{ needs.second-review.outputs.touched }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MERGE_GATE: ${{ inputs.merge-gate-workflow }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          run() { if [ "$DRY_RUN" = true ]; then echo "(dry run) $*"; else "$@" > /dev/null; fi; }
          case "$RESULT:$VERDICT" in
            success:skip) echo "Nothing to post: $DESCRIPTION"; exit 0 ;;
            success:pass) state=success ;;
            success:blocking) state=failure ;;
            *) state=error; [ -n "$DESCRIPTION" ] || DESCRIPTION="The second review didn't finish; see the run" ;;
          esac
          echo "$state: $DESCRIPTION"
          read_statuses() {
            gh api --paginate "repos/$REPO/commits/$SHA/statuses?per_page=100" \
              --jq '.[] | [.context, .state, .creator.login, (.description // ""), (.target_url // "")] | @json'
          }
          # The runs a "Second review" status (or the comment) names, looked up: only a run of this same workflow, event and
          # head repository whose head_sha is this head and whose pull_requests lists this pull request (or, once GitHub has
          # emptied that list, whose head_branch is its branch) counts (agent_review.py trusted); anything else, or a run that
          # can't be looked up, counts for nothing.
          look_up_runs() {
            : > "$RUNNER_TEMP/runs.jsonl"
            for id in $(python3 -I .fleet/fleet_tools/agent_review.py second runs "$RUNNER_TEMP/comments.jsonl" <<< "$1"); do
              gh api "repos/$REPO/actions/runs/$id" --jq '[.id, .workflow_id, .event, .head_sha, .head_branch, .head_repository.full_name, [.pull_requests[].number], .status] | @json' \
                >> "$RUNNER_TEMP/runs.jsonl" 2> /dev/null || echo "Run $id couldn't be looked up: its statuses count for nothing."
            done
          }
          # After posting, a status another run wrote meanwhile is put right: the decided one goes back on top.
          settle() {
            for _ in 1 2 3; do
              statuses=$(read_statuses)
              look_up_runs "$statuses"
              mapfile -t restore < <(python3 -I .fleet/fleet_tools/agent_review.py second settle "$SHA" "$RUNNER_TEMP/runs.jsonl" <<< "$statuses")
              [ "${#restore[@]}" -eq 3 ] || break
              echo "Another status was set on this head meanwhile: posting the decided ${restore[0]} again."
              run gh api -X POST "repos/$REPO/statuses/$SHA" -f state="${restore[0]}" -f context="Second review" \
                -f description="${restore[2]:0:140}" -f target_url="${restore[1]}"
              [ "$DRY_RUN" != true ] || break
            done
          }
          DESCRIPTION=${DESCRIPTION:0:140}
          export DESCRIPTION
          gh api --paginate "repos/$REPO/issues/$PR/comments?per_page=100" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- second-review -->"))) | [.id, .body] | @json' \
            > "$RUNNER_TEMP/comments.jsonl"
          statuses=$(read_statuses)
          look_up_runs "$statuses"
          # Which run decides the head's "Second review" (docs/agent-review.md, "Which run decides"): the run that started
          # last, except that a complete review's blocking verdict stands over a later pass; whichever finishes first.
          python3 -I .fleet/fleet_tools/agent_review.py second publish "$SHA" "$RUNNER_TEMP/runs.jsonl" "$RUNNER_TEMP/comments.jsonl" "$state" \
            <<< "$statuses" | tee "$RUNNER_TEMP/publish.txt"
          post=$(sed -n 's/^status=//p' "$RUNNER_TEMP/publish.txt")
          post_description=$(sed -n 's/^description=//p' "$RUNNER_TEMP/publish.txt")
          read -r action existing written < <(sed -n 's/^comment=//p' "$RUNNER_TEMP/publish.txt")
          if [ -z "$post" ]; then
            echo "Run $(sed -n 's/^decided_by=//p' "$RUNNER_TEMP/publish.txt") decides this head's \"Second review\"; this run's $state isn't posted."
            exit 0
          fi
          if [ -n "$COMMENT" ]; then
            base64 -d <<< "$COMMENT" > comment.md
            # The second review's own outcomes record (its marker), merged and shown as for the first review.
            base64 -d <<< "$TOUCHED" > touched.txt
            base64 -d <<< "$FINDINGS" > findings.json
            python3 -I .fleet/fleet_tools/review_outcomes.py --finish comment.md --second --repo "$REPO" --pr "$PR" --sha "$SHA" \
              --incremental "$INCREMENTAL" --touched touched.txt --findings findings.json
            if [ "$DRY_RUN" = true ]; then echo "(dry run) the comment:"; cat comment.md; echo; fi
            # One second-review comment per pull request, updated by each second review (the marker is its first line),
            # unless another run's verdict decides the head (a later final verdict, or an earlier blocking one this run
            # stands for) or a later run wrote the comment for a newer head.
            case "$action" in
              patch) run gh api -X PATCH "repos/$REPO/issues/comments/$existing" -F body=@comment.md ;;
              post) run gh api -X POST "repos/$REPO/issues/$PR/comments" -F body=@comment.md ;;
              keep) echo "Run $written, which started after this one, wrote the comment; it stays as it is." ;;
              none) echo "This run's verdict isn't the one that decides the head; the comment stays as it is." ;;
              *) echo "::error::Couldn't tell which run wrote the second review's comment"; exit 1 ;;
            esac
          fi
          [ "$post" = "$state" ] || echo "An earlier run's blocking verdict stands over this run's $state."
          run gh api -X POST "repos/$REPO/statuses/$SHA" -f state="$post" -f context="Second review" \
            -f description="${post_description:0:140}" -f target_url="$RUN_URL"
          settle
          if [ -n "$MERGE_GATE" ]; then
            run gh workflow run "$MERGE_GATE" --repo "$REPO" --ref main -f pr="$PR"
          fi
