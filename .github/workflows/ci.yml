name: fleet CI

# `make check` on every pull request and every push to main: ruff, mypy, the tests, fleet self-check, actionlint and
# zizmor over the workflows, and `claude plugin validate` (the Claude Code .github/agent-review/ locks), at the versions
# pyproject.toml and the Makefile pin. A pull request's changelog fragment and title are release-check.yml's.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: fleet-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions: {}

# bash, which runs each step with -eo pipefail: a command that fails inside a pipeline fails the step (without it, only
# the last command in a pipeline counts, and a failed curl passes silently).
defaults:
  run:
    shell: bash

jobs:
  check:
    name: make check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
      # The oldest Python fleet_tools supports (pyproject.toml's requires-python), so nothing newer slips in.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0   # v7.1.0
        id: python
        with:
          python-version: "3.11"
      - name: Install Poetry
        env:
          PYTHON_PATH: ${{ steps.python.outputs.python-path }}
        run: pipx install --python "$PYTHON_PATH" "poetry==2.5.1"
      - name: make setup
        run: make setup
      # GH_TOKEN lets zizmor run its online audits too (impostor commits, known-vulnerable actions).
      - name: make check
        env:
          GH_TOKEN: ${{ github.token }}
        run: make check

  system-python:
    name: fleet checks on the system Python
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
      # The runner's own python3, with nothing installed, and the standard library first, as release.yml's Plan runs
      # fleet: -I (-E, -s and -P, so the checkout isn't first on sys.path, where a root-level file named like a
      # standard-library module would be imported in its place) and -S (no site-packages), then `-c` appends the
      # checkout ("$PWD") to sys.path and runs fleet_tools.cli.
      - name: fleet checks on each fixture consumer
        run: |
          /usr/bin/python3 --version
          for consumer in tests/fixtures/consumer-*/; do
            /usr/bin/python3 -I -S -c 'import sys; sys.path.append(sys.argv.pop(1)); from fleet_tools.cli import main; sys.exit(main())' "$PWD" checks --root "$consumer"
          done
