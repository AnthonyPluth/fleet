name: Self-test

# Calls each of fleet's reusable workflows by local path, with `fleet-ref: ${{ github.sha }}` so it fetches its scripts
# from this pull request's own commit, and with test inputs. Each extraction issue adds its case here; `fleet
# self-check` fails on a call without that fleet-ref, except `checks-own-commit`, the one call that must have none: it
# runs the default, fleet's files at the workflow's own commit (job.workflow_sha).
on:
  pull_request:

concurrency:
  group: self-test-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

# bash, which runs each step with -eo pipefail: a command that fails inside a pipeline fails the step.
defaults:
  run:
    shell: bash

jobs:
  # The security scans over fleet itself, in the mode a repository without code scanning uses (`sarif-upload: false`:
  # a finding fails the job): Semgrep over fleet's own code and scripts, Trivy over the files, zizmor over the
  # workflows; no web app, no image, no Scorecard (it never runs on a pull request anyway). The called jobs ask for
  # `security-events: write`, so the caller grants it.
  security:
    name: Security scans
    permissions:
      contents: read
      pull-requests: read
      security-events: write
      actions: read
      id-token: write
    uses: ./.github/workflows/security.yml   # zizmor: ignore[self-repository] fleet self-check requires this form
    with:
      fleet-ref: ${{ github.sha }}
      code-paths: ^(fleet_tools|\.github/scripts)/
      semgrep-paths: fleet_tools .github/scripts
      zizmor-paths: .github
      sarif-upload: false
      scorecard: false

  # With `sarif-upload: false`, the planted finding in the fixture tree (its own .semgrep rule flags its one line)
  # must fail the Semgrep step: the step passes only when the script exits non-zero. With SARIF it must reach the
  # SARIF and fail `fail-on-findings`' check.
  planted-finding:
    name: A planted Semgrep finding fails without SARIF upload
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
      - name: Semgrep over the planted fixture tree
        env:
          ROOT: tests/fixtures/security/planted
          SARIF_UPLOAD: "false"
          SEMGREP: pipx run semgrep==1.146.0
        run: |
          if .github/scripts/security-semgrep.sh; then
            echo "::error::Semgrep passed over the planted finding"
            exit 1
          fi
          echo "Semgrep failed on the planted finding, as it should."
      # With SARIF (and fail-on-findings), the same finding must be in the SARIF and fail the check that runs after
      # the upload.
      - name: Semgrep with SARIF over the planted fixture tree, then the fail-on-findings check
        env:
          ROOT: tests/fixtures/security/planted
          SARIF_UPLOAD: "true"
          SEMGREP: pipx run semgrep==1.146.0
        run: |
          .github/scripts/security-semgrep.sh
          if python3 -I .github/scripts/sarif_findings.py tests/fixtures/security/planted/semgrep.sarif; then
            echo "::error::The fail-on-findings check passed over the planted finding"
            exit 1
          fi
          echo "The fail-on-findings check failed on the planted finding, as it should."

  # The deep-scan reminder in dry run on fleet itself: it reads fleet's issues and prints the issue it would open (or
  # that one is open) without opening anything. The called job asks for `issues: write` and `contents: read` (the
  # commit count's compare call), so the caller grants both.
  deep-scan-due:
    name: Deep scan due (dry run)
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/deep-scan-due.yml   # zizmor: ignore[self-repository] fleet self-check requires this form
    with:
      fleet-ref: ${{ github.sha }}
      dry-run: true

  # Review mining in dry run on fleet itself: it reads fleet's own pull requests and the reviews' comments on them,
  # measures the loop (`fleet loop-stats`: the job summary and the `loop-stats.json` artifact are produced), prints
  # the report it would post, with its "Loop health" section, and opens or rewrites nothing. The called job asks for
  # `issues: write`, so the caller grants it.
  review-mining:
    name: Review mining (dry run)
    permissions:
      contents: read
      issues: write
      pull-requests: read
    uses: ./.github/workflows/review-mining.yml   # zizmor: ignore[self-repository] fleet self-check requires this form
    with:
      fleet-ref: ${{ github.sha }}
      dry-run: true

  # The dry run's loop-stats artifact exists: its link came back through the workflow's output, and this run's
  # artifact list holds a non-empty `loop-stats.json`.
  review-mining-artifact:
    name: Review mining (dry run) artifact
    needs: [review-mining]
    runs-on: ubuntu-latest   # hosted: fleet's own CI, one API read
    timeout-minutes: 5
    permissions:
      actions: read            # this run's artifact list
    steps:
      - name: The loop-stats artifact was uploaded
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUNS: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts/
          URL: ${{ needs.review-mining.outputs.loop-stats-url }}
        run: |
          echo "loop-stats artifact: ${URL:-none}"
          case "$URL" in "$RUNS"*) ;; *) echo "::error::The loop-stats artifact's link isn't this run's: '$URL'"; exit 1 ;; esac
          size=$(gh api --paginate "repos/$REPO/actions/runs/$RUN_ID/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name == "loop-stats.json") | .size_in_bytes' | sort -n | tail -n 1)
          [ "${size:-0}" -gt 0 ] || { echo "::error::This run has no non-empty loop-stats.json artifact"; exit 1; }

  # Mining tasks on a fixture event (the owner ticks one row of a made-up report), in dry run: it lists fleet's own
  # review-mining issues for the row's marker, prints the issue it would open and the link it would write back, and
  # opens or edits nothing. The called job asks for `issues: write`, so the caller grants it.
  mining-tasks:
    name: Mining tasks (fixture, dry run)
    permissions:
      issues: write
    uses: ./.github/workflows/mining-tasks.yml   # zizmor: ignore[self-repository] fleet self-check requires this form
    with:
      fleet-ref: ${{ github.sha }}
      fixture: tests/fixtures/events/mining-tasks-tick.json

  # The merge gate decides this pull request's own head in dry run: it prints the status it would post (pending while
  # this very workflow runs) and never posts, merges, marks ready or starts anything. The called job asks for the write permissions
  # the real gate needs, so the caller must grant them (a called workflow can't be given more than its caller has).
  merge-gate:
    name: Merge gate (dry run)
    permissions:
      contents: write
      pull-requests: write
      statuses: write
      actions: write
      checks: read
    uses: ./.github/workflows/merge-gate.yml   # zizmor: ignore[self-repository] fleet self-check requires this form
    with:
      fleet-ref: ${{ github.sha }}
      sha: ${{ github.event.pull_request.head.sha }}
      required-workflows: fleet CI
      required-statuses: ""
      dry-run: true

  # The merge gate's review-thread half in dry run: it prints the workflow start it would make for this pull request
  # and starts nothing. The called job asks for `actions: write`, so the caller grants it.
  merge-gate-threads:
    name: Merge gate threads (dry run)
    permissions:
      actions: write
    uses: ./.github/workflows/merge-gate-threads.yml   # zizmor: ignore[self-repository] fleet self-check requires this form
    with:
      fleet-ref: ${{ github.sha }}
      pr: ${{ github.event.pull_request.number }}
      dry-run: true

  # The agent review on this pull request in dry run, with the first review turned on (`first-review: true`; it is off
  # by default) and fleet's stub reviewer (tests/fakes/claude) in place of Claude Code, so the plumbing is tested
  # without a secret: the detection, the last review's state, the checkout and
  # the gathering of the change, the runner script, the verdict and the report job, which prints the comment and the
  # status instead of posting them. Three answers: a pass, a blocking finding, and a malformed answer, which must be
  # an error, never a pass. The called jobs ask for the write permissions the real review needs, so the caller grants
  # them (a called workflow can't be given more than its caller has).
  agent-review-pass:
    name: Agent review (dry run, passing)
    permissions:
      contents: read
      pull-requests: write
      statuses: write
      actions: write
    uses: ./.github/workflows/agent-review.yml   # zizmor: ignore[self-repository] fleet self-check requires this form
    with:
      fleet-ref: ${{ github.sha }}
      dry-run: true
      first-review: true
      fake-review: pass
      merge-gate-workflow: ""

  agent-review-blocking:
    name: Agent review (dry run, blocking)
    permissions:
      contents: read
      pull-requests: write
      statuses: write
      actions: write
    uses: ./.github/workflows/agent-review.yml   # zizmor: ignore[self-repository] fleet self-check requires this form
    with:
      fleet-ref: ${{ github.sha }}
      dry-run: true
      first-review: true
      fake-review: blocking
      merge-gate-workflow: ""

  agent-review-malformed:
    name: Agent review (dry run, malformed answer)
    permissions:
      contents: read
      pull-requests: write
      statuses: write
      actions: write
    uses: ./.github/workflows/agent-review.yml   # zizmor: ignore[self-repository] fleet self-check requires this form
    with:
      fleet-ref: ${{ github.sha }}
      dry-run: true
      first-review: true
      fake-review: malformed
      merge-gate-workflow: ""

  # The verification record (FLEET-VERIFY-REVIEW): with `verification: true` the review reads this pull request's own
  # record (fleet's template carries one) into verification.md, and the stub answers with a blocking finding of the
  # kind "Verification that doesn't cover the change", which must fail the status like any other. The three cases
  # above leave the input at its default, so they also show that nothing changes without it.
  agent-review-verification:
    name: Agent review (dry run, verification record, blocking)
    permissions:
      contents: read
      pull-requests: write
      statuses: write
      actions: write
    uses: ./.github/workflows/agent-review.yml   # zizmor: ignore[self-repository] fleet self-check requires this form
    with:
      fleet-ref: ${{ github.sha }}
      dry-run: true
      first-review: true
      fake-review: verification
      verification: true
      merge-gate-workflow: ""

  # The review secrets' environment (the `environment` input, #116): both reviews of this pull request in the
  # environment agent-review-self-test, which GitHub created in this repository the first time a job named it. It holds
  # no secret (the stub reviewer needs none), and has no required reviewer and no branch restriction, because the
  # self-test runs on pull_request, whose ref is refs/pull/<n>/merge; an app's own environment is limited to its
  # default branch instead. Every other call here leaves the input empty. The faked event (a security label) starts
  # second-pending too, so all five of this call's jobs run; agent-review-environment-verdicts checks which ran in it.
  agent-review-environment:
    name: Agent review (dry run, environment)
    permissions:
      contents: read
      pull-requests: write
      statuses: write
      actions: write
    uses: ./.github/workflows/agent-review.yml   # zizmor: ignore[self-repository] fleet self-check requires this form
    with:
      fleet-ref: ${{ github.sha }}
      dry-run: true
      first-review: true
      fake-review: advisory
      fake-event: action=synchronize labels=security files=README.md
      environment: agent-review-self-test
      merge-gate-workflow: ""

  # The verdicts the four runs reached, through the reusable workflow's outputs. A pull request that isn't an agent's
  # (the owner's by hand) gets "Not an agent's pull request" from each and runs no stub, which is the right answer too.
  # The verification case also reports the hash of the record it read: empty means this pull request's description has
  # no record block, so that path wasn't exercised here, which is a warning rather than a failure.
  agent-review-verdicts:
    name: Agent review (dry run) verdicts
    needs: [agent-review-pass, agent-review-blocking, agent-review-malformed, agent-review-verification]
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest   # hosted: fleet's own CI, a few lines of shell
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Each stub answer reached the verdict it should
        env:
          PASS: ${{ needs.agent-review-pass.outputs.verdict }}
          PASS_WHY: ${{ needs.agent-review-pass.outputs.description }}
          BLOCKING: ${{ needs.agent-review-blocking.outputs.verdict }}
          BLOCKING_WHY: ${{ needs.agent-review-blocking.outputs.description }}
          MALFORMED: ${{ needs.agent-review-malformed.outputs.verdict }}
          MALFORMED_WHY: ${{ needs.agent-review-malformed.outputs.description }}
          VERIFICATION: ${{ needs.agent-review-verification.outputs.verdict }}
          VERIFICATION_WHY: ${{ needs.agent-review-verification.outputs.description }}
          VERIFICATION_RECORD: ${{ needs.agent-review-verification.outputs.record }}
        run: |
          echo "pass: $PASS ($PASS_WHY); blocking: $BLOCKING ($BLOCKING_WHY); malformed: $MALFORMED ($MALFORMED_WHY)"
          echo "verification: $VERIFICATION ($VERIFICATION_WHY), record ${VERIFICATION_RECORD:-none}"
          if [ "$PASS_WHY" = "Not an agent's pull request" ]; then
            [ "$PASS:$BLOCKING:$MALFORMED:$VERIFICATION" = "pass:pass:pass:pass" ] || { echo "::error::A non-agent pull request should pass every run"; exit 1; }
            exit 0
          fi
          [ "$PASS" = pass ] || { echo "::error::The passing answer gave $PASS"; exit 1; }
          [ "$BLOCKING" = blocking ] || { echo "::error::The blocking answer gave $BLOCKING"; exit 1; }
          [ "$MALFORMED" = error ] || { echo "::error::The malformed answer gave $MALFORMED, not error"; exit 1; }
          [ "$VERIFICATION" = blocking ] || { echo "::error::The verification answer gave $VERIFICATION, not blocking"; exit 1; }
          if [ -z "$VERIFICATION_RECORD" ]; then
            echo "::warning::This pull request's description has no verification record, so the review read none; the template's block is missing"
          fi

  # The finding outcomes (FLEET-FINDING-OUTCOMES) with the stub reviewer, through the same runner script, verdict and
  # outcomes steps the review runs, on fixed commits and recorded comments: a blocking finding, then a push the stub
  # passes, gives `resolved`; the owner's `/fleet dismiss` shows and changes no status; a member's is ignored.
  finding-outcomes:
    name: Finding outcomes (stub reviewer)
    runs-on: ubuntu-latest   # hosted: fleet's own CI, the stub reviewer and a few lines of shell
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
      - name: A fixed finding resolves and a dismissal changes no status
        run: .github/scripts/finding-outcomes-self-test.sh

  # The order of second reviews on one head (#69): the second-pending and second-report steps of agent-review.yml, run
  # as they are against a fake GitHub that keeps state (tests/fakes/github), in the push-then-label and label-then-push
  # orders, with re-runs, a push to a new head and a single run; a blocking verdict of the run that started later stands.
  second-review-order:
    name: Second review order (fake GitHub)
    runs-on: ubuntu-latest   # hosted: fleet's own CI, a fake gh and a few lines of shell
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
      - name: The run that started later decides, whichever finishes first
        run: python3 -m unittest -v tests.test_second_review_order

  # The verify run on a fixture tree (tests/fixtures/verify/): Python with Poetry's virtualenv, Node with the packages,
  # libfaketime and two small apt-packages (exiftool, as Darkroom asks for, and GNU hello, which the runner image
  # lacks) are set up as for an app, no browser, and its `make smoke` checks each is there and writes a marker.
  verify:
    name: Verify (fixture)
    permissions:
      contents: read
    uses: ./.github/workflows/verify.yml   # zizmor: ignore[self-repository] fleet self-check requires this form
    with:
      fleet-ref: ${{ github.sha }}
      make-target: smoke
      working-directory: tests/fixtures/verify
      node-dir: tests/fixtures/verify/frontend
      node-version-file: tests/fixtures/verify/.nvmrc
      browser: ""
      apt-packages: hello libimage-exiftool-perl
      timeout-minutes: 10

  # The docs build on a fixture tree (tests/fixtures/docs/): Node from its .nvmrc with npm's cache keyed on its lockfile,
  # no browser, and its `make docs-build` writes the one page the site check looks for. A pull request never deploys:
  # the upload and the deploy job run only on main. The called deploy job asks for `pages: write` and `id-token: write`,
  # so the caller grants them.
  docs:
    name: Docs (fixture)
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yml   # zizmor: ignore[self-repository] fleet self-check requires this form
    with:
      fleet-ref: ${{ github.sha }}
      working-directory: tests/fixtures/docs
      site-path: tests/fixtures/docs/docs/dist
      node-version-file: tests/fixtures/docs/.nvmrc
      npm-lockfiles: tests/fixtures/docs/docs/package-lock.json
      timeout-minutes: 5

  # The screenshot diff over two fixture PNG sets (one changed, one added, one removed, one the same), committed to a
  # made-up repository on the runner: it uploads the report and summary.json and, in dry run, prints the comment instead
  # of posting it. The called job asks for `pull-requests: write`, so the caller grants it.
  screenshot-diff:
    name: Screenshot diff (fixture, dry run)
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/screenshot-diff.yml   # zizmor: ignore[self-repository] fleet self-check requires this form
    with:
      fleet-ref: ${{ github.sha }}
      fixture: tests/fixtures/screenshot-diff/before tests/fixtures/screenshot-diff/after
      dry-run: true

  # The image pipeline's build on a fixture image (tests/fixtures/docker/), as a pull request runs it: `fleet next-version`
  # doesn't run (a pull request is never released), the image is built for this runner and its start check passes only
  # because smoke-env reaches the container, and nothing is built for ARM, cached, pushed or tagged. The second image's
  # check passes only when its command replaces the fixture's failing entrypoint, each line as one argument, in a
  # container with no capabilities, no new privileges, the fixture's seccomp profile (which refuses mkdir) and the
  # /dev/shm size given; the Compose check only because compose-env sets the variable the fixture's file requires. The
  # publish call isn't tested here: on a pull request it is skipped by its own condition, which
  # tests/test_docker_workflow.py holds.
  # The call grants what its publish and cleanup jobs ask for, as an app's does: GitHub checks every called job against
  # the caller's permissions before the run starts, even the skipped ones. The build job itself takes `contents: read`.
  docker:
    name: Docker image (fixture, build)
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/docker.yml   # zizmor: ignore[self-repository] fleet self-check requires this form
    with:
      fleet-ref: ${{ github.sha }}
      image: fleet-self-test
      context: tests/fixtures/docker
      dockerfile: tests/fixtures/docker/Dockerfile
      smoke-env: |
        FLEET_SMOKE=on
      second-image: fleet-self-test-second
      second-dockerfile: tests/fixtures/docker/Dockerfile.second
      second-smoke-command: |
        sh
        /smoke.sh
        two words
      second-smoke-seccomp: tests/fixtures/docker/seccomp.json
      second-smoke-shm-size: 128m
      compose-file: tests/fixtures/docker/compose.yaml
      compose-env: |
        FLEET_COMPOSE=on
      build-timeout-minutes: 10

  # The build's outputs on a pull request: no version, nothing new, no skip, so a caller's publish call (`needs:` the
  # build, `if: skip != 'true'`) would rest on its own condition alone, which refuses a pull request.
  docker-outputs:
    name: Docker image (fixture) outputs
    needs: [docker]
    runs-on: ubuntu-latest   # hosted: fleet's own CI, a few lines of shell
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: A pull request's build works out no version
        env:
          VERSION: ${{ needs.docker.outputs.version }}
          NEW: ${{ needs.docker.outputs.new }}
          NEWEST: ${{ needs.docker.outputs.newest }}
          SKIP: ${{ needs.docker.outputs.skip }}
        run: |
          echo "version: '$VERSION'; new: '$NEW'; newest: '$NEWEST'; skip: '$SKIP'"
          [ -z "$VERSION$NEW$NEWEST$SKIP" ] || { echo "::error::A pull request's build worked out a version"; exit 1; }

  # Cancel-on-close joins two groups of its own (a pattern with the pull request's number, and a prefix), which nothing
  # else uses: it checks the matrix and the group names, and cancels nothing.
  cancel-on-close:
    name: Cancel runs on close (groups of its own)
    uses: ./.github/workflows/cancel-on-close.yml   # zizmor: ignore[self-repository] fleet self-check requires this form
    with:
      fleet-ref: ${{ github.sha }}
      groups: '["self-test-cancel-{0}", "self-test-cancel-prefix-"]'

  # The consumer checks (FLEET-SYNC) on a fixture consumer, with the tools from this pull request's commit in place of
  # the one .fleet/version names: `fleet checks --commits` over this pull request's range and `fleet drift` pass on
  # the clean fixture, and `fleet drift` must fail on the drifted one (expect-drift inverts that step). The fixtures'
  # content is this tree's under a made-up commit (fleet_tools/release.py's FIXTURE_COMMIT), which fixture-commit
  # tells `fleet drift` to take for this fleet's own.
  checks-clean:
    name: Checks (clean fixture)
    permissions:
      contents: read
    uses: ./.github/workflows/checks.yml   # zizmor: ignore[self-repository] fleet self-check requires this form
    with:
      fleet-ref: ${{ github.sha }}
      working-directory: tests/fixtures/consumer-waypoint
      fixture-commit: 0123456789abcdef0123456789abcdef01234567

  # The same clean-fixture checks without fleet-ref, the one call that has none (fleet self-check holds it), so the
  # default path runs on every pull request: the fleet checkout at job.workflow_sha (this pull request's commit, as a
  # local call's own commit is the caller's) behind its guard step, as an app's call runs it at the commit it pins.
  checks-own-commit:
    name: Checks (clean fixture, at its own commit)
    permissions:
      contents: read
    uses: ./.github/workflows/checks.yml   # zizmor: ignore[self-repository] fleet self-check requires this form
    with:
      working-directory: tests/fixtures/consumer-waypoint
      fixture-commit: 0123456789abcdef0123456789abcdef01234567

  checks-drifted:
    name: Checks (drifted fixture)
    permissions:
      contents: read
    uses: ./.github/workflows/checks.yml   # zizmor: ignore[self-repository] fleet self-check requires this form
    with:
      fleet-ref: ${{ github.sha }}
      working-directory: tests/fixtures/drifted
      expect-drift: true
      fixture-commit: 0123456789abcdef0123456789abcdef01234567

  # The content sync (FLEET-SYNC) in dry run on fixture consumers built from this commit (fixture implies dry-run: no
  # App, no push, no pull request, no issue), one case each from the acceptance criteria: pins a minor ahead of the
  # content, which must change exactly the AGENTS.md blocks, the vendored files and .fleet/version and nothing under
  # .github/workflows/; pins equal to the content, which does nothing; pins a major ahead, which is the migration issue.
  # Each case's fixture differs, so the calls land in distinct concurrency groups. The called job asks for
  # `issues: write`, so the caller grants it.
  sync-minor:
    name: Sync (fixture, pins a minor ahead)
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/sync.yml   # zizmor: ignore[self-repository] fleet self-check requires this form
    with:
      fleet-ref: ${{ github.sha }}
      fixture: pins=v1.1.0 content=v1.0.0

  sync-equal:
    name: Sync (fixture, pins equal to the content)
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/sync.yml   # zizmor: ignore[self-repository] fleet self-check requires this form
    with:
      fleet-ref: ${{ github.sha }}
      fixture: pins=v1.0.0 content=v1.0.0

  sync-major:
    name: Sync (fixture, pins a major ahead)
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/sync.yml   # zizmor: ignore[self-repository] fleet self-check requires this form
    with:
      fleet-ref: ${{ github.sha }}
      fixture: pins=v2.0.0 content=v1.0.0

  # What each sync case decided, through the reusable workflow's outputs: the files the minor case changed are exactly
  # the ones a sync owns (tests/sync_fixture.py --expected), the equal case did nothing, the major case has the issue.
  sync-verdicts:
    name: Sync (fixture) verdicts
    needs: [sync-minor, sync-equal, sync-major]
    runs-on: ubuntu-latest   # hosted: fleet's own CI, a few lines of shell
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
      - name: Each case reached the plan it should
        env:
          MINOR: ${{ needs.sync-minor.outputs.action }}
          MINOR_TITLE: ${{ needs.sync-minor.outputs.title }}
          MINOR_CHANGED: ${{ needs.sync-minor.outputs.changed }}
          EQUAL: ${{ needs.sync-equal.outputs.action }}
          EQUAL_TITLE: ${{ needs.sync-equal.outputs.title }}
          MAJOR: ${{ needs.sync-major.outputs.action }}
          MAJOR_TITLE: ${{ needs.sync-major.outputs.title }}
          MAJOR_BODY: ${{ needs.sync-major.outputs.body }}
        run: |
          echo "minor: $MINOR ($MINOR_TITLE); equal: $EQUAL ($EQUAL_TITLE); major: $MAJOR ($MAJOR_TITLE)"
          [ "$MINOR" = sync ] || { echo "::error::Pins a minor ahead gave $MINOR, not sync"; exit 1; }
          [ "$MINOR_TITLE" = "chore: fleet content v1.1.0" ] || { echo "::error::The pull request's title is '$MINOR_TITLE'"; exit 1; }
          base64 -d <<< "$MINOR_CHANGED" | sort > changed.txt
          python3 -E -s tests/sync_fixture.py --expected | sort > expected.txt
          if ! diff -u expected.txt changed.txt; then echo "::error::The sync commit's files aren't exactly the AGENTS blocks, the vendored files and .fleet/version"; exit 1; fi
          if grep -q '^\.github/workflows/' changed.txt; then echo "::error::The sync changed a workflow"; exit 1; fi
          if ! { [ "$EQUAL" = none ] && [ -z "$EQUAL_TITLE" ]; }; then echo "::error::Pins equal to the content gave $EQUAL ($EQUAL_TITLE), not none"; exit 1; fi
          [ "$MAJOR" = migration ] || { echo "::error::Pins a major ahead gave $MAJOR, not migration"; exit 1; }
          [ "$MAJOR_TITLE" = "fleet v2 needs a migration: see CHANGELOG" ] || { echo "::error::The issue's title is '$MAJOR_TITLE'"; exit 1; }
          base64 -d <<< "$MAJOR_BODY" > body.md
          grep -q "another major version" body.md || { echo "::error::The issue's body doesn't say why"; exit 1; }
          grep -q "fleet sync --to v2.0.0" body.md || { echo "::error::The issue's body doesn't say how"; exit 1; }

  # The second review on this pull request in dry run, with the stub reviewer and a faked event (fake-event, honoured
  # only with fake-review), one case each from FLEET-SECOND-REVIEW's acceptance criteria. The first review is off in
  # these (they leave `first-review` at its default, false, as an app's caller does), and each case's inputs differ, so
  # the calls land in distinct concurrency groups.
  second-review-label:
    name: Second review (dry run, risky by label, blocking)
    permissions:
      contents: read
      pull-requests: write
      statuses: write
      actions: write
    uses: ./.github/workflows/agent-review.yml   # zizmor: ignore[self-repository] fleet self-check requires this form
    with:
      fleet-ref: ${{ github.sha }}
      dry-run: true
      fake-review: blocking
      fake-event: action=opened labels=security,docs files=README.md
      merge-gate-workflow: ""

  second-review-path:
    name: Second review (dry run, risky by path)
    permissions:
      contents: read
      pull-requests: write
      statuses: write
      actions: write
    uses: ./.github/workflows/agent-review.yml   # zizmor: ignore[self-repository] fleet self-check requires this form
    with:
      fleet-ref: ${{ github.sha }}
      dry-run: true
      fake-review: pass
      fake-event: action=opened labels=docs files=app/photos/delete.py,README.md
      second-review-paths: |
        app/photos/**
        app/library/**
      merge-gate-workflow: ""

  second-review-github:
    name: Second review (dry run, risky by a .github change)
    permissions:
      contents: read
      pull-requests: write
      statuses: write
      actions: write
    uses: ./.github/workflows/agent-review.yml   # zizmor: ignore[self-repository] fleet self-check requires this form
    with:
      fleet-ref: ${{ github.sha }}
      dry-run: true
      fake-review: pass
      fake-event: action=synchronize labels= files=.github/workflows/ci.yml
      merge-gate-workflow: ""

  second-review-not-risky:
    name: Second review (dry run, not risky)
    permissions:
      contents: read
      pull-requests: write
      statuses: write
      actions: write
    uses: ./.github/workflows/agent-review.yml   # zizmor: ignore[self-repository] fleet self-check requires this form
    with:
      fleet-ref: ${{ github.sha }}
      dry-run: true
      fake-review: pass
      fake-event: action=synchronize labels=docs files=README.md,app/app.py
      merge-gate-workflow: ""

  second-review-unlabeled-by-another:
    name: Second review (dry run, unlabeled by a non-owner)
    permissions:
      contents: read
      pull-requests: write
      statuses: write
      actions: write
    uses: ./.github/workflows/agent-review.yml   # zizmor: ignore[self-repository] fleet self-check requires this form
    with:
      fleet-ref: ${{ github.sha }}
      dry-run: true
      fake-review: pass
      fake-event: action=unlabeled sender=octocat label=security labels= files=.github/workflows/ci.yml
      merge-gate-workflow: ""

  second-review-unlabeled-by-owner:
    name: Second review (dry run, unlabeled by the owner)
    permissions:
      contents: read
      pull-requests: write
      statuses: write
      actions: write
    uses: ./.github/workflows/agent-review.yml   # zizmor: ignore[self-repository] fleet self-check requires this form
    with:
      fleet-ref: ${{ github.sha }}
      dry-run: true
      fake-review: pass
      fake-event: action=unlabeled sender=${{ github.repository_owner }} label=security labels= files=README.md
      merge-gate-workflow: ""

  # The second review's verdicts, through the reusable workflow's second-verdict output: a finding fails it, a risky
  # change without one passes, a change that isn't risky passes saying so, a non-owner's unlabeled event posts nothing
  # (skip), and the owner's is re-evaluated (here to not risky). On a pull request that isn't an agent's each is
  # "Not an agent's pull request", which is right too.
  second-review-verdicts:
    name: Second review (dry run) verdicts
    needs: [second-review-label, second-review-path, second-review-github, second-review-not-risky, second-review-unlabeled-by-another, second-review-unlabeled-by-owner]
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest   # hosted: fleet's own CI, a few lines of shell
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Each case reached the verdict it should
        env:
          LABEL: ${{ needs.second-review-label.outputs.second-verdict }}
          LABEL_WHY: ${{ needs.second-review-label.outputs.second-description }}
          PATH_V: ${{ needs.second-review-path.outputs.second-verdict }}
          PATH_WHY: ${{ needs.second-review-path.outputs.second-description }}
          GITHUB_V: ${{ needs.second-review-github.outputs.second-verdict }}
          GITHUB_WHY: ${{ needs.second-review-github.outputs.second-description }}
          NOT_RISKY: ${{ needs.second-review-not-risky.outputs.second-verdict }}
          NOT_RISKY_WHY: ${{ needs.second-review-not-risky.outputs.second-description }}
          OTHER: ${{ needs.second-review-unlabeled-by-another.outputs.second-verdict }}
          OTHER_WHY: ${{ needs.second-review-unlabeled-by-another.outputs.second-description }}
          OWNER: ${{ needs.second-review-unlabeled-by-owner.outputs.second-verdict }}
          OWNER_WHY: ${{ needs.second-review-unlabeled-by-owner.outputs.second-description }}
        run: |
          echo "label: $LABEL ($LABEL_WHY); path: $PATH_V ($PATH_WHY); .github: $GITHUB_V ($GITHUB_WHY)"
          echo "not risky: $NOT_RISKY ($NOT_RISKY_WHY); unlabeled by another: $OTHER ($OTHER_WHY); by the owner: $OWNER ($OWNER_WHY)"
          if [ "$LABEL_WHY" = "Not an agent's pull request" ]; then
            [ "$LABEL:$PATH_V:$GITHUB_V:$NOT_RISKY:$OWNER" = "pass:pass:pass:pass:pass" ] || { echo "::error::A non-agent pull request should pass every run"; exit 1; }
            [ "$OTHER" = skip ] || { echo "::error::A non-owner's unlabeled event gave $OTHER, not skip"; exit 1; }
            exit 0
          fi
          [ "$LABEL" = blocking ] || { echo "::error::The labelled case gave $LABEL, not blocking"; exit 1; }
          if ! { [ "$PATH_V" = pass ] && [[ "$PATH_WHY" == "No blocking findings"* ]]; }; then echo "::error::The path case gave $PATH_V ($PATH_WHY)"; exit 1; fi
          if ! { [ "$GITHUB_V" = pass ] && [[ "$GITHUB_WHY" == "No blocking findings"* ]]; }; then echo "::error::The .github case gave $GITHUB_V ($GITHUB_WHY)"; exit 1; fi
          if ! { [ "$NOT_RISKY" = pass ] && [ "$NOT_RISKY_WHY" = "Not a risky pull request" ]; }; then echo "::error::The not-risky case gave $NOT_RISKY ($NOT_RISKY_WHY)"; exit 1; fi
          [ "$OTHER" = skip ] || { echo "::error::A non-owner's unlabeled event gave $OTHER, not skip"; exit 1; }
          if ! { [ "$OWNER" = pass ] && [ "$OWNER_WHY" = "Not a risky pull request" ]; }; then echo "::error::The owner's unlabeled event gave $OWNER ($OWNER_WHY)"; exit 1; fi

  # Which jobs of this run ran in an environment. GitHub records a deployment for each job that names one, and its
  # statuses link the job, so this run's deployments must be exactly the environment case's Review and Second review,
  # both in agent-review-self-test: the other three jobs of that call, and every job of the calls that leave
  # `environment` empty, ran in none. It waits for every call of agent-review.yml, so no job can start in one after it
  # looked. On a pull request from a fork no job may run in one at all (the reviews keep a fork's out of it).
  agent-review-environment-verdicts:
    name: Agent review (dry run, environment) verdicts
    needs: [agent-review-environment, agent-review-pass, agent-review-blocking, agent-review-malformed, agent-review-verification, second-review-label, second-review-path, second-review-github, second-review-not-risky, second-review-unlabeled-by-another, second-review-unlabeled-by-owner]
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest   # hosted: fleet's own CI, a few reads of the API
    timeout-minutes: 5
    permissions:
      actions: read            # this run's jobs, their ids and names
      deployments: read        # the deployments of this run's commit and their statuses
    steps:
      - name: Only the environment case's two review jobs ran in an environment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          RUN_ID: ${{ github.run_id }}
          ATTEMPT: ${{ github.run_attempt }}
          SHA: ${{ github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          FIRST: ${{ needs.agent-review-environment.outputs.verdict }}
          FIRST_WHY: ${{ needs.agent-review-environment.outputs.description }}
          SECOND: ${{ needs.agent-review-environment.outputs.second-verdict }}
          SECOND_WHY: ${{ needs.agent-review-environment.outputs.second-description }}
        run: |
          echo "environment case: first review $FIRST ($FIRST_WHY); second review $SECOND ($SECOND_WHY)"
          if [ "$HEAD_REPO" = "$REPO" ]; then
            [ "$FIRST" = pass ] || { echo "::error::The environment case's first review gave $FIRST, not pass"; exit 1; }
            [ "$SECOND" = pass ] || { echo "::error::The environment case's second review gave $SECOND, not pass"; exit 1; }
            printf 'agent-review-self-test\t%s\n' "Agent review (dry run, environment) / Review" \
              "Agent review (dry run, environment) / Second review" > expected.tsv
          else
            echo "A pull request from a fork: no job may run in an environment."
            : > expected.tsv
          fi
          gh api --paginate "repos/$REPO/actions/runs/$RUN_ID/attempts/$ATTEMPT/jobs?per_page=100" \
            --jq '.jobs[] | [.id, .name] | @tsv' > jobs.tsv
          for sha in "$SHA" "$HEAD_SHA"; do
            gh api --paginate "repos/$REPO/deployments?sha=$sha&per_page=100" --jq '.[] | [.id, .environment] | @tsv'
          done | sort -u > deployments.tsv
          : > ran-in.tsv
          while IFS=$'\t' read -r id environment; do
            gh api --paginate "repos/$REPO/deployments/$id/statuses?per_page=100" --jq '.[].log_url' \
              | sed -n "s#^.*/actions/runs/$RUN_ID/job/\([0-9][0-9]*\)\$#\1#p" | sort -u > job-ids.txt
            while read -r job; do
              awk -F'\t' -v id="$job" -v environment="$environment" '$1 == id { print environment "\t" $2 }' jobs.tsv >> ran-in.tsv
            done < job-ids.txt
          done < deployments.tsv
          sort -u ran-in.tsv -o ran-in.tsv
          echo "This run's jobs that ran in an environment:"
          cat ran-in.tsv
          if ! diff -u expected.tsv ran-in.tsv; then
            echo "::error::Only the environment case's Review and Second review may run in an environment, and only in agent-review-self-test"
            exit 1
          fi
