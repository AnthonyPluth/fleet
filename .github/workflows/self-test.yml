name: Self-test

# Calls each of fleet's reusable workflows by local path, with `fleet-ref: ${{ github.sha }}` so it fetches its scripts
# from this pull request's own commit rather than its FLEET_REF, and with test inputs. Each extraction issue adds its
# case here; `fleet self-check` fails on a call without that fleet-ref.
on:
  pull_request:

concurrency:
  group: self-test-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

# bash, which runs each step with -eo pipefail: a command that fails inside a pipeline fails the step.
defaults:
  run:
    shell: bash

jobs:
  # The security scans over fleet itself, in the mode a repository without code scanning uses (`sarif-upload: false`:
  # a finding fails the job): Semgrep over fleet's own code and scripts, Trivy over the files, zizmor over the
  # workflows; no web app, no image, no Scorecard (it never runs on a pull request anyway). The called jobs ask for
  # `security-events: write`, so the caller grants it.
  security:
    name: Security scans
    permissions:
      contents: read
      pull-requests: read
      security-events: write
      actions: read
      id-token: write
    uses: ./.github/workflows/security.yml   # zizmor: ignore[self-repository] fleet self-check requires this form
    with:
      fleet-ref: ${{ github.sha }}
      code-paths: ^(fleet_tools|\.github/scripts)/
      semgrep-paths: fleet_tools .github/scripts
      sarif-upload: false
      scorecard: false

  # With `sarif-upload: false`, the planted finding in the fixture tree (its own .semgrep rule flags its one line)
  # must fail the Semgrep step: the step passes only when the script exits non-zero.
  planted-finding:
    name: A planted Semgrep finding fails without SARIF upload
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
      - name: Semgrep over the planted fixture tree
        env:
          ROOT: tests/fixtures/security/planted
          SARIF_UPLOAD: "false"
          SEMGREP: pipx run semgrep==1.146.0
        run: |
          if .github/scripts/security-semgrep.sh; then
            echo "::error::Semgrep passed over the planted finding"
            exit 1
          fi
          echo "Semgrep failed on the planted finding, as it should."

  # The deep-scan reminder in dry run on fleet itself: it reads fleet's issues and prints the issue it would open (or
  # that one is open) without opening anything. The called job asks for `issues: write`, so the caller grants it.
  deep-scan-due:
    name: Deep scan due (dry run)
    permissions:
      issues: write
    uses: ./.github/workflows/deep-scan-due.yml   # zizmor: ignore[self-repository] fleet self-check requires this form
    with:
      fleet-ref: ${{ github.sha }}
      dry-run: true

  # The merge gate decides this pull request's own head in dry run: it prints the status it would post (pending while
  # this very workflow runs) and never posts, merges or starts anything. The called job asks for the write permissions
  # the real gate needs, so the caller must grant them (a called workflow can't be given more than its caller has).
  merge-gate:
    name: Merge gate (dry run)
    permissions:
      contents: write
      pull-requests: write
      statuses: write
      actions: write
      checks: read
    uses: ./.github/workflows/merge-gate.yml   # zizmor: ignore[self-repository] fleet self-check requires this form
    with:
      fleet-ref: ${{ github.sha }}
      sha: ${{ github.event.pull_request.head.sha }}
      required-workflows: fleet CI
      required-statuses: ""
      dry-run: true

  # The agent review on this pull request in dry run, with fleet's stub reviewer (tests/fakes/claude) in place of
  # Claude Code, so the plumbing is tested without a secret: the detection, the last review's state, the checkout and
  # the gathering of the change, the runner script, the verdict and the report job, which prints the comment and the
  # status instead of posting them. Three answers: a pass, a blocking finding, and a malformed answer, which must be
  # an error, never a pass. The called jobs ask for the write permissions the real review needs, so the caller grants
  # them (a called workflow can't be given more than its caller has).
  agent-review-pass:
    name: Agent review (dry run, passing)
    permissions:
      contents: read
      pull-requests: write
      statuses: write
      actions: write
    uses: ./.github/workflows/agent-review.yml   # zizmor: ignore[self-repository] fleet self-check requires this form
    with:
      fleet-ref: ${{ github.sha }}
      dry-run: true
      fake-review: pass
      merge-gate-workflow: ""

  agent-review-blocking:
    name: Agent review (dry run, blocking)
    permissions:
      contents: read
      pull-requests: write
      statuses: write
      actions: write
    uses: ./.github/workflows/agent-review.yml   # zizmor: ignore[self-repository] fleet self-check requires this form
    with:
      fleet-ref: ${{ github.sha }}
      dry-run: true
      fake-review: blocking
      merge-gate-workflow: ""

  agent-review-malformed:
    name: Agent review (dry run, malformed answer)
    permissions:
      contents: read
      pull-requests: write
      statuses: write
      actions: write
    uses: ./.github/workflows/agent-review.yml   # zizmor: ignore[self-repository] fleet self-check requires this form
    with:
      fleet-ref: ${{ github.sha }}
      dry-run: true
      fake-review: malformed
      merge-gate-workflow: ""

  # The verdicts the three runs reached, through the reusable workflow's outputs. A pull request that isn't an agent's
  # (the owner's by hand) gets "Not an agent's pull request" from each and runs no stub, which is the right answer too.
  agent-review-verdicts:
    name: Agent review (dry run) verdicts
    needs: [agent-review-pass, agent-review-blocking, agent-review-malformed]
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest   # hosted: fleet's own CI, a few lines of shell
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Each stub answer reached the verdict it should
        env:
          PASS: ${{ needs.agent-review-pass.outputs.verdict }}
          PASS_WHY: ${{ needs.agent-review-pass.outputs.description }}
          BLOCKING: ${{ needs.agent-review-blocking.outputs.verdict }}
          BLOCKING_WHY: ${{ needs.agent-review-blocking.outputs.description }}
          MALFORMED: ${{ needs.agent-review-malformed.outputs.verdict }}
          MALFORMED_WHY: ${{ needs.agent-review-malformed.outputs.description }}
        run: |
          echo "pass: $PASS ($PASS_WHY); blocking: $BLOCKING ($BLOCKING_WHY); malformed: $MALFORMED ($MALFORMED_WHY)"
          if [ "$PASS_WHY" = "Not an agent's pull request" ]; then
            [ "$PASS:$BLOCKING:$MALFORMED" = "pass:pass:pass" ] || { echo "::error::A non-agent pull request should pass every run"; exit 1; }
            exit 0
          fi
          [ "$PASS" = pass ] || { echo "::error::The passing answer gave $PASS"; exit 1; }
          [ "$BLOCKING" = blocking ] || { echo "::error::The blocking answer gave $BLOCKING"; exit 1; }
          [ "$MALFORMED" = error ] || { echo "::error::The malformed answer gave $MALFORMED, not error"; exit 1; }
