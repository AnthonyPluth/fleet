name: Self-test

# Calls each of fleet's reusable workflows by local path, with `fleet-ref: ${{ github.sha }}` so it fetches its scripts
# from this pull request's own commit rather than its FLEET_REF, and with test inputs. Each extraction issue adds its
# case here; `fleet self-check` fails on a call without that fleet-ref.
on:
  pull_request:

concurrency:
  group: self-test-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

# bash, which runs each step with -eo pipefail: a command that fails inside a pipeline fails the step.
defaults:
  run:
    shell: bash

jobs:
  # The security scans over fleet itself, in the mode a repository without code scanning uses (`sarif-upload: false`:
  # a finding fails the job): Semgrep over fleet's own code and scripts, Trivy over the files, zizmor over the
  # workflows; no web app, no image, no Scorecard (it never runs on a pull request anyway). The called jobs ask for
  # `security-events: write`, so the caller grants it.
  security:
    name: Security scans
    permissions:
      contents: read
      pull-requests: read
      security-events: write
      actions: read
      id-token: write
    uses: ./.github/workflows/security.yml   # zizmor: ignore[self-repository] fleet self-check requires this form
    with:
      fleet-ref: ${{ github.sha }}
      code-paths: ^(fleet_tools|\.github/scripts)/
      semgrep-paths: fleet_tools .github/scripts
      sarif-upload: false
      scorecard: false

  # With `sarif-upload: false`, the planted finding in the fixture tree (its own .semgrep rule flags its one line)
  # must fail the Semgrep step: the step passes only when the script exits non-zero.
  planted-finding:
    name: A planted Semgrep finding fails without SARIF upload
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
      - name: Semgrep over the planted fixture tree
        env:
          ROOT: tests/fixtures/security/planted
          SARIF_UPLOAD: "false"
          SEMGREP: pipx run semgrep==1.146.0
        run: |
          if .github/scripts/security-semgrep.sh; then
            echo "::error::Semgrep passed over the planted finding"
            exit 1
          fi
          echo "Semgrep failed on the planted finding, as it should."

  # The deep-scan reminder in dry run on fleet itself: it reads fleet's issues and prints the issue it would open (or
  # that one is open) without opening anything. The called job asks for `issues: write`, so the caller grants it.
  deep-scan-due:
    name: Deep scan due (dry run)
    permissions:
      issues: write
    uses: ./.github/workflows/deep-scan-due.yml   # zizmor: ignore[self-repository] fleet self-check requires this form
    with:
      fleet-ref: ${{ github.sha }}
      dry-run: true

  # The merge gate decides this pull request's own head in dry run: it prints the status it would post (pending while
  # this very workflow runs) and never posts, merges or starts anything. The called job asks for the write permissions
  # the real gate needs, so the caller must grant them (a called workflow can't be given more than its caller has).
  merge-gate:
    name: Merge gate (dry run)
    permissions:
      contents: write
      pull-requests: write
      statuses: write
      actions: write
      checks: read
    uses: ./.github/workflows/merge-gate.yml   # zizmor: ignore[self-repository] fleet self-check requires this form
    with:
      fleet-ref: ${{ github.sha }}
      sha: ${{ github.event.pull_request.head.sha }}
      required-workflows: fleet CI
      required-statuses: ""
      dry-run: true

  # The verify run on a fixture tree (tests/fixtures/verify/): Python with Poetry's virtualenv, Node with the packages
  # and libfaketime are set up as for an app, no browser, and its `make smoke` checks each is there and writes a marker.
  verify:
    name: Verify (fixture)
    permissions:
      contents: read
    uses: ./.github/workflows/verify.yml   # zizmor: ignore[self-repository] fleet self-check requires this form
    with:
      fleet-ref: ${{ github.sha }}
      make-target: smoke
      working-directory: tests/fixtures/verify
      node-dir: tests/fixtures/verify/frontend
      node-version-file: tests/fixtures/verify/.nvmrc
      browser: ""
      timeout-minutes: 10

  # The screenshot diff over two fixture PNG sets (one changed, one added, one removed, one the same), committed to a
  # made-up repository on the runner: it uploads the report and summary.json and, in dry run, prints the comment instead
  # of posting it. The called job asks for `pull-requests: write`, so the caller grants it.
  screenshot-diff:
    name: Screenshot diff (fixture, dry run)
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/screenshot-diff.yml   # zizmor: ignore[self-repository] fleet self-check requires this form
    with:
      fleet-ref: ${{ github.sha }}
      fixture: tests/fixtures/screenshot-diff/before tests/fixtures/screenshot-diff/after
      dry-run: true

  # Cancel-on-close joins two groups of its own (a pattern with the pull request's number, and a prefix), which nothing
  # else uses: it checks the matrix and the group names, and cancels nothing.
  cancel-on-close:
    name: Cancel runs on close (groups of its own)
    uses: ./.github/workflows/cancel-on-close.yml   # zizmor: ignore[self-repository] fleet self-check requires this form
    with:
      fleet-ref: ${{ github.sha }}
      groups: '["self-test-cancel-{0}", "self-test-cancel-prefix-"]'
