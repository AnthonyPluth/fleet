name: Self-test

# Calls each of fleet's reusable workflows by local path, with `fleet-ref: ${{ github.sha }}` so it fetches its scripts
# from this pull request's own commit rather than its FLEET_REF, and with test inputs. Each extraction issue adds its
# case here; `fleet self-check` fails on a call without that fleet-ref.
on:
  pull_request:

concurrency:
  group: self-test-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

# bash, which runs each step with -eo pipefail: a command that fails inside a pipeline fails the step.
defaults:
  run:
    shell: bash

jobs:
  # The security scans over fleet itself, in the mode a repository without code scanning uses (`sarif-upload: false`:
  # a finding fails the job): Semgrep over fleet's own code and scripts, Trivy over the files, zizmor over the
  # workflows; no web app, no image, no Scorecard (it never runs on a pull request anyway). The called jobs ask for
  # `security-events: write`, so the caller grants it.
  security:
    name: Security scans
    permissions:
      contents: read
      pull-requests: read
      security-events: write
      actions: read
      id-token: write
    uses: ./.github/workflows/security.yml   # zizmor: ignore[self-repository] fleet self-check requires this form
    with:
      fleet-ref: ${{ github.sha }}
      code-paths: ^(fleet_tools|\.github/scripts)/
      semgrep-paths: fleet_tools .github/scripts
      zizmor-paths: .github
      sarif-upload: false
      scorecard: false

  # With `sarif-upload: false`, the planted finding in the fixture tree (its own .semgrep rule flags its one line)
  # must fail the Semgrep step: the step passes only when the script exits non-zero.
  planted-finding:
    name: A planted Semgrep finding fails without SARIF upload
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
      - name: Semgrep over the planted fixture tree
        env:
          ROOT: tests/fixtures/security/planted
          SARIF_UPLOAD: "false"
          SEMGREP: pipx run semgrep==1.146.0
        run: |
          if .github/scripts/security-semgrep.sh; then
            echo "::error::Semgrep passed over the planted finding"
            exit 1
          fi
          echo "Semgrep failed on the planted finding, as it should."

  # The deep-scan reminder in dry run on fleet itself: it reads fleet's issues and prints the issue it would open (or
  # that one is open) without opening anything. The called job asks for `issues: write`, so the caller grants it.
  deep-scan-due:
    name: Deep scan due (dry run)
    permissions:
      issues: write
    uses: ./.github/workflows/deep-scan-due.yml   # zizmor: ignore[self-repository] fleet self-check requires this form
    with:
      fleet-ref: ${{ github.sha }}
      dry-run: true

  # Review mining in dry run on fleet itself: it reads fleet's own pull requests and the reviews' comments on them,
  # prints the report it would post and the job summary, and opens or rewrites nothing. The called job asks for
  # `issues: write`, so the caller grants it.
  review-mining:
    name: Review mining (dry run)
    permissions:
      contents: read
      issues: write
      pull-requests: read
    uses: ./.github/workflows/review-mining.yml   # zizmor: ignore[self-repository] fleet self-check requires this form
    with:
      fleet-ref: ${{ github.sha }}
      dry-run: true

  # The merge gate decides this pull request's own head in dry run: it prints the status it would post (pending while
  # this very workflow runs) and never posts, merges or starts anything. The called job asks for the write permissions
  # the real gate needs, so the caller must grant them (a called workflow can't be given more than its caller has).
  merge-gate:
    name: Merge gate (dry run)
    permissions:
      contents: write
      pull-requests: write
      statuses: write
      actions: write
      checks: read
    uses: ./.github/workflows/merge-gate.yml   # zizmor: ignore[self-repository] fleet self-check requires this form
    with:
      fleet-ref: ${{ github.sha }}
      sha: ${{ github.event.pull_request.head.sha }}
      required-workflows: fleet CI
      required-statuses: ""
      dry-run: true

  # The agent review on this pull request in dry run, with fleet's stub reviewer (tests/fakes/claude) in place of
  # Claude Code, so the plumbing is tested without a secret: the detection, the last review's state, the checkout and
  # the gathering of the change, the runner script, the verdict and the report job, which prints the comment and the
  # status instead of posting them. Three answers: a pass, a blocking finding, and a malformed answer, which must be
  # an error, never a pass. The called jobs ask for the write permissions the real review needs, so the caller grants
  # them (a called workflow can't be given more than its caller has).
  agent-review-pass:
    name: Agent review (dry run, passing)
    permissions:
      contents: read
      pull-requests: write
      statuses: write
      actions: write
    uses: ./.github/workflows/agent-review.yml   # zizmor: ignore[self-repository] fleet self-check requires this form
    with:
      fleet-ref: ${{ github.sha }}
      dry-run: true
      fake-review: pass
      merge-gate-workflow: ""

  agent-review-blocking:
    name: Agent review (dry run, blocking)
    permissions:
      contents: read
      pull-requests: write
      statuses: write
      actions: write
    uses: ./.github/workflows/agent-review.yml   # zizmor: ignore[self-repository] fleet self-check requires this form
    with:
      fleet-ref: ${{ github.sha }}
      dry-run: true
      fake-review: blocking
      merge-gate-workflow: ""

  agent-review-malformed:
    name: Agent review (dry run, malformed answer)
    permissions:
      contents: read
      pull-requests: write
      statuses: write
      actions: write
    uses: ./.github/workflows/agent-review.yml   # zizmor: ignore[self-repository] fleet self-check requires this form
    with:
      fleet-ref: ${{ github.sha }}
      dry-run: true
      fake-review: malformed
      merge-gate-workflow: ""

  # The verification record (FLEET-VERIFY-REVIEW): with `verification: true` the review reads this pull request's own
  # record (fleet's template carries one) into verification.md, and the stub answers with a blocking finding of the
  # kind "Verification that doesn't cover the change", which must fail the status like any other. The three cases
  # above leave the input at its default, so they also show that nothing changes without it.
  agent-review-verification:
    name: Agent review (dry run, verification record, blocking)
    permissions:
      contents: read
      pull-requests: write
      statuses: write
      actions: write
    uses: ./.github/workflows/agent-review.yml   # zizmor: ignore[self-repository] fleet self-check requires this form
    with:
      fleet-ref: ${{ github.sha }}
      dry-run: true
      fake-review: verification
      verification: true
      merge-gate-workflow: ""

  # The verdicts the four runs reached, through the reusable workflow's outputs. A pull request that isn't an agent's
  # (the owner's by hand) gets "Not an agent's pull request" from each and runs no stub, which is the right answer too.
  # The verification case also reports the hash of the record it read: empty means this pull request's description has
  # no record block, so that path wasn't exercised here, which is a warning rather than a failure.
  agent-review-verdicts:
    name: Agent review (dry run) verdicts
    needs: [agent-review-pass, agent-review-blocking, agent-review-malformed, agent-review-verification]
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest   # hosted: fleet's own CI, a few lines of shell
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Each stub answer reached the verdict it should
        env:
          PASS: ${{ needs.agent-review-pass.outputs.verdict }}
          PASS_WHY: ${{ needs.agent-review-pass.outputs.description }}
          BLOCKING: ${{ needs.agent-review-blocking.outputs.verdict }}
          BLOCKING_WHY: ${{ needs.agent-review-blocking.outputs.description }}
          MALFORMED: ${{ needs.agent-review-malformed.outputs.verdict }}
          MALFORMED_WHY: ${{ needs.agent-review-malformed.outputs.description }}
          VERIFICATION: ${{ needs.agent-review-verification.outputs.verdict }}
          VERIFICATION_WHY: ${{ needs.agent-review-verification.outputs.description }}
          VERIFICATION_RECORD: ${{ needs.agent-review-verification.outputs.record }}
        run: |
          echo "pass: $PASS ($PASS_WHY); blocking: $BLOCKING ($BLOCKING_WHY); malformed: $MALFORMED ($MALFORMED_WHY)"
          echo "verification: $VERIFICATION ($VERIFICATION_WHY), record ${VERIFICATION_RECORD:-none}"
          if [ "$PASS_WHY" = "Not an agent's pull request" ]; then
            [ "$PASS:$BLOCKING:$MALFORMED:$VERIFICATION" = "pass:pass:pass:pass" ] || { echo "::error::A non-agent pull request should pass every run"; exit 1; }
            exit 0
          fi
          [ "$PASS" = pass ] || { echo "::error::The passing answer gave $PASS"; exit 1; }
          [ "$BLOCKING" = blocking ] || { echo "::error::The blocking answer gave $BLOCKING"; exit 1; }
          [ "$MALFORMED" = error ] || { echo "::error::The malformed answer gave $MALFORMED, not error"; exit 1; }
          [ "$VERIFICATION" = blocking ] || { echo "::error::The verification answer gave $VERIFICATION, not blocking"; exit 1; }
          if [ -z "$VERIFICATION_RECORD" ]; then
            echo "::warning::This pull request's description has no verification record, so the review read none; the template's block is missing"
          fi

  # The finding outcomes (FLEET-FINDING-OUTCOMES) with the stub reviewer, through the same runner script, verdict and
  # outcomes steps the review runs, on fixed commits and recorded comments: a blocking finding, then a push the stub
  # passes, gives `resolved`; the owner's `/fleet dismiss` shows and changes no status; a member's is ignored.
  finding-outcomes:
    name: Finding outcomes (stub reviewer)
    runs-on: ubuntu-latest   # hosted: fleet's own CI, the stub reviewer and a few lines of shell
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
      - name: A fixed finding resolves and a dismissal changes no status
        run: .github/scripts/finding-outcomes-self-test.sh

  # The verify run on a fixture tree (tests/fixtures/verify/): Python with Poetry's virtualenv, Node with the packages
  # and libfaketime are set up as for an app, no browser, and its `make smoke` checks each is there and writes a marker.
  verify:
    name: Verify (fixture)
    permissions:
      contents: read
    uses: ./.github/workflows/verify.yml   # zizmor: ignore[self-repository] fleet self-check requires this form
    with:
      fleet-ref: ${{ github.sha }}
      make-target: smoke
      working-directory: tests/fixtures/verify
      node-dir: tests/fixtures/verify/frontend
      node-version-file: tests/fixtures/verify/.nvmrc
      browser: ""
      timeout-minutes: 10

  # The screenshot diff over two fixture PNG sets (one changed, one added, one removed, one the same), committed to a
  # made-up repository on the runner: it uploads the report and summary.json and, in dry run, prints the comment instead
  # of posting it. The called job asks for `pull-requests: write`, so the caller grants it.
  screenshot-diff:
    name: Screenshot diff (fixture, dry run)
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/screenshot-diff.yml   # zizmor: ignore[self-repository] fleet self-check requires this form
    with:
      fleet-ref: ${{ github.sha }}
      fixture: tests/fixtures/screenshot-diff/before tests/fixtures/screenshot-diff/after
      dry-run: true

  # Cancel-on-close joins two groups of its own (a pattern with the pull request's number, and a prefix), which nothing
  # else uses: it checks the matrix and the group names, and cancels nothing.
  cancel-on-close:
    name: Cancel runs on close (groups of its own)
    uses: ./.github/workflows/cancel-on-close.yml   # zizmor: ignore[self-repository] fleet self-check requires this form
    with:
      fleet-ref: ${{ github.sha }}
      groups: '["self-test-cancel-{0}", "self-test-cancel-prefix-"]'

  # The consumer checks (FLEET-SYNC) on a fixture consumer, with the tools from this pull request's commit in place of
  # the version .fleet/version names: `fleet checks --commits` over this pull request's range and `fleet drift` pass on
  # the clean fixture, and `fleet drift` must fail on the drifted one (expect-drift inverts that step).
  checks-clean:
    name: Checks (clean fixture)
    permissions:
      contents: read
    uses: ./.github/workflows/checks.yml   # zizmor: ignore[self-repository] fleet self-check requires this form
    with:
      fleet-ref: ${{ github.sha }}
      working-directory: tests/fixtures/consumer-waypoint

  checks-drifted:
    name: Checks (drifted fixture)
    permissions:
      contents: read
    uses: ./.github/workflows/checks.yml   # zizmor: ignore[self-repository] fleet self-check requires this form
    with:
      fleet-ref: ${{ github.sha }}
      working-directory: tests/fixtures/drifted
      expect-drift: true

  # The content sync (FLEET-SYNC) in dry run on fixture consumers built from this commit (fixture implies dry-run: no
  # App, no push, no pull request, no issue), one case each from the acceptance criteria: pins a minor ahead of the
  # content, which must change exactly the AGENTS.md blocks, the vendored files and .fleet/version and nothing under
  # .github/workflows/; pins equal to the content, which does nothing; pins a major ahead, which is the migration issue.
  # Each case's fixture differs, so the calls land in distinct concurrency groups. The called job asks for
  # `issues: write`, so the caller grants it.
  sync-minor:
    name: Sync (fixture, pins a minor ahead)
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/sync.yml   # zizmor: ignore[self-repository] fleet self-check requires this form
    with:
      fleet-ref: ${{ github.sha }}
      fixture: pins=v1.1.0 content=v1.0.0

  sync-equal:
    name: Sync (fixture, pins equal to the content)
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/sync.yml   # zizmor: ignore[self-repository] fleet self-check requires this form
    with:
      fleet-ref: ${{ github.sha }}
      fixture: pins=v1.0.0 content=v1.0.0

  sync-major:
    name: Sync (fixture, pins a major ahead)
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/sync.yml   # zizmor: ignore[self-repository] fleet self-check requires this form
    with:
      fleet-ref: ${{ github.sha }}
      fixture: pins=v2.0.0 content=v1.0.0

  # What each sync case decided, through the reusable workflow's outputs: the files the minor case changed are exactly
  # the ones a sync owns (tests/sync_fixture.py --expected), the equal case did nothing, the major case has the issue.
  sync-verdicts:
    name: Sync (fixture) verdicts
    needs: [sync-minor, sync-equal, sync-major]
    runs-on: ubuntu-latest   # hosted: fleet's own CI, a few lines of shell
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
      - name: Each case reached the plan it should
        env:
          MINOR: ${{ needs.sync-minor.outputs.action }}
          MINOR_TITLE: ${{ needs.sync-minor.outputs.title }}
          MINOR_CHANGED: ${{ needs.sync-minor.outputs.changed }}
          EQUAL: ${{ needs.sync-equal.outputs.action }}
          EQUAL_TITLE: ${{ needs.sync-equal.outputs.title }}
          MAJOR: ${{ needs.sync-major.outputs.action }}
          MAJOR_TITLE: ${{ needs.sync-major.outputs.title }}
          MAJOR_BODY: ${{ needs.sync-major.outputs.body }}
        run: |
          echo "minor: $MINOR ($MINOR_TITLE); equal: $EQUAL ($EQUAL_TITLE); major: $MAJOR ($MAJOR_TITLE)"
          [ "$MINOR" = sync ] || { echo "::error::Pins a minor ahead gave $MINOR, not sync"; exit 1; }
          [ "$MINOR_TITLE" = "chore: fleet content v1.1.0" ] || { echo "::error::The pull request's title is '$MINOR_TITLE'"; exit 1; }
          base64 -d <<< "$MINOR_CHANGED" | sort > changed.txt
          python3 -E -s tests/sync_fixture.py --expected | sort > expected.txt
          if ! diff -u expected.txt changed.txt; then echo "::error::The sync commit's files aren't exactly the AGENTS blocks, the vendored files and .fleet/version"; exit 1; fi
          if grep -q '^\.github/workflows/' changed.txt; then echo "::error::The sync changed a workflow"; exit 1; fi
          if ! { [ "$EQUAL" = none ] && [ -z "$EQUAL_TITLE" ]; }; then echo "::error::Pins equal to the content gave $EQUAL ($EQUAL_TITLE), not none"; exit 1; fi
          [ "$MAJOR" = migration ] || { echo "::error::Pins a major ahead gave $MAJOR, not migration"; exit 1; }
          [ "$MAJOR_TITLE" = "fleet v2 needs a migration: see CHANGELOG" ] || { echo "::error::The issue's title is '$MAJOR_TITLE'"; exit 1; }
          base64 -d <<< "$MAJOR_BODY" > body.md
          grep -q "another major version" body.md || { echo "::error::The issue's body doesn't say why"; exit 1; }
          grep -q "fleet sync --to v2.0.0" body.md || { echo "::error::The issue's body doesn't say how"; exit 1; }

  # The second review on this pull request in dry run, with the stub reviewer and a faked event (fake-event, honoured
  # only with fake-review), one case each from FLEET-SECOND-REVIEW's acceptance criteria. The first review is off in
  # these (first-review: false), and each case's inputs differ, so the calls land in distinct concurrency groups.
  second-review-label:
    name: Second review (dry run, risky by label, blocking)
    permissions:
      contents: read
      pull-requests: write
      statuses: write
      actions: write
    uses: ./.github/workflows/agent-review.yml   # zizmor: ignore[self-repository] fleet self-check requires this form
    with:
      fleet-ref: ${{ github.sha }}
      dry-run: true
      first-review: false
      fake-review: blocking
      fake-event: action=opened labels=security,docs files=README.md
      merge-gate-workflow: ""

  second-review-path:
    name: Second review (dry run, risky by path)
    permissions:
      contents: read
      pull-requests: write
      statuses: write
      actions: write
    uses: ./.github/workflows/agent-review.yml   # zizmor: ignore[self-repository] fleet self-check requires this form
    with:
      fleet-ref: ${{ github.sha }}
      dry-run: true
      first-review: false
      fake-review: pass
      fake-event: action=opened labels=docs files=app/photos/delete.py,README.md
      second-review-paths: |
        app/photos/**
        app/library/**
      merge-gate-workflow: ""

  second-review-github:
    name: Second review (dry run, risky by a .github change)
    permissions:
      contents: read
      pull-requests: write
      statuses: write
      actions: write
    uses: ./.github/workflows/agent-review.yml   # zizmor: ignore[self-repository] fleet self-check requires this form
    with:
      fleet-ref: ${{ github.sha }}
      dry-run: true
      first-review: false
      fake-review: pass
      fake-event: action=synchronize labels= files=.github/workflows/ci.yml
      merge-gate-workflow: ""

  second-review-not-risky:
    name: Second review (dry run, not risky)
    permissions:
      contents: read
      pull-requests: write
      statuses: write
      actions: write
    uses: ./.github/workflows/agent-review.yml   # zizmor: ignore[self-repository] fleet self-check requires this form
    with:
      fleet-ref: ${{ github.sha }}
      dry-run: true
      first-review: false
      fake-review: pass
      fake-event: action=synchronize labels=docs files=README.md,app/app.py
      merge-gate-workflow: ""

  second-review-unlabeled-by-another:
    name: Second review (dry run, unlabeled by a non-owner)
    permissions:
      contents: read
      pull-requests: write
      statuses: write
      actions: write
    uses: ./.github/workflows/agent-review.yml   # zizmor: ignore[self-repository] fleet self-check requires this form
    with:
      fleet-ref: ${{ github.sha }}
      dry-run: true
      first-review: false
      fake-review: pass
      fake-event: action=unlabeled sender=octocat label=security labels= files=.github/workflows/ci.yml
      merge-gate-workflow: ""

  second-review-unlabeled-by-owner:
    name: Second review (dry run, unlabeled by the owner)
    permissions:
      contents: read
      pull-requests: write
      statuses: write
      actions: write
    uses: ./.github/workflows/agent-review.yml   # zizmor: ignore[self-repository] fleet self-check requires this form
    with:
      fleet-ref: ${{ github.sha }}
      dry-run: true
      first-review: false
      fake-review: pass
      fake-event: action=unlabeled sender=${{ github.repository_owner }} label=security labels= files=README.md
      merge-gate-workflow: ""

  # The second review's verdicts, through the reusable workflow's second-verdict output: a finding fails it, a risky
  # change without one passes, a change that isn't risky passes saying so, a non-owner's unlabeled event posts nothing
  # (skip), and the owner's is re-evaluated (here to not risky). On a pull request that isn't an agent's each is
  # "Not an agent's pull request", which is right too.
  second-review-verdicts:
    name: Second review (dry run) verdicts
    needs: [second-review-label, second-review-path, second-review-github, second-review-not-risky, second-review-unlabeled-by-another, second-review-unlabeled-by-owner]
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest   # hosted: fleet's own CI, a few lines of shell
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Each case reached the verdict it should
        env:
          LABEL: ${{ needs.second-review-label.outputs.second-verdict }}
          LABEL_WHY: ${{ needs.second-review-label.outputs.second-description }}
          PATH_V: ${{ needs.second-review-path.outputs.second-verdict }}
          PATH_WHY: ${{ needs.second-review-path.outputs.second-description }}
          GITHUB_V: ${{ needs.second-review-github.outputs.second-verdict }}
          GITHUB_WHY: ${{ needs.second-review-github.outputs.second-description }}
          NOT_RISKY: ${{ needs.second-review-not-risky.outputs.second-verdict }}
          NOT_RISKY_WHY: ${{ needs.second-review-not-risky.outputs.second-description }}
          OTHER: ${{ needs.second-review-unlabeled-by-another.outputs.second-verdict }}
          OTHER_WHY: ${{ needs.second-review-unlabeled-by-another.outputs.second-description }}
          OWNER: ${{ needs.second-review-unlabeled-by-owner.outputs.second-verdict }}
          OWNER_WHY: ${{ needs.second-review-unlabeled-by-owner.outputs.second-description }}
        run: |
          echo "label: $LABEL ($LABEL_WHY); path: $PATH_V ($PATH_WHY); .github: $GITHUB_V ($GITHUB_WHY)"
          echo "not risky: $NOT_RISKY ($NOT_RISKY_WHY); unlabeled by another: $OTHER ($OTHER_WHY); by the owner: $OWNER ($OWNER_WHY)"
          if [ "$LABEL_WHY" = "Not an agent's pull request" ]; then
            [ "$LABEL:$PATH_V:$GITHUB_V:$NOT_RISKY:$OWNER" = "pass:pass:pass:pass:pass" ] || { echo "::error::A non-agent pull request should pass every run"; exit 1; }
            [ "$OTHER" = skip ] || { echo "::error::A non-owner's unlabeled event gave $OTHER, not skip"; exit 1; }
            exit 0
          fi
          [ "$LABEL" = blocking ] || { echo "::error::The labelled case gave $LABEL, not blocking"; exit 1; }
          if ! { [ "$PATH_V" = pass ] && [[ "$PATH_WHY" == "No blocking findings"* ]]; }; then echo "::error::The path case gave $PATH_V ($PATH_WHY)"; exit 1; fi
          if ! { [ "$GITHUB_V" = pass ] && [[ "$GITHUB_WHY" == "No blocking findings"* ]]; }; then echo "::error::The .github case gave $GITHUB_V ($GITHUB_WHY)"; exit 1; fi
          if ! { [ "$NOT_RISKY" = pass ] && [ "$NOT_RISKY_WHY" = "Not a risky pull request" ]; }; then echo "::error::The not-risky case gave $NOT_RISKY ($NOT_RISKY_WHY)"; exit 1; fi
          [ "$OTHER" = skip ] || { echo "::error::A non-owner's unlabeled event gave $OTHER, not skip"; exit 1; }
          if ! { [ "$OWNER" = pass ] && [ "$OWNER_WHY" = "Not a risky pull request" ]; }; then echo "::error::The owner's unlabeled event gave $OWNER ($OWNER_WHY)"; exit 1; fi
