name: Release

# Every push to main is a release (docs/release.md). Nothing in fleet's tree names its version, so the release is the
# merged commit as it is: tagged vX.Y.Z and published as a GitHub Release, never a release commit. Three jobs:
#
# - make check (contents: read): the whole suite on the merged commit, because two pull requests that each passed can
#   break main together; nothing is released while it fails.
# - Plan (contents: read): on a fresh checkout and the runner's own python3, `fleet next-version --first-parent
#   --fragments` works out the version from main's first-parent commits since the last tag, one per merged pull request
#   (its title: feat: a minor, a ! or BREAKING CHANGE: a major, anything else a patch; a breaking changelog fragment
#   added since that tag's tree a major whatever the titles say), and skips a commit that isn't main's newest any more.
#   `fleet release notes --since` then writes the notes: the changelog fragments this commit's tree adds to the
#   previous tag's, and the subject of each merge that added none.
# - Tag and release (contents: write, nothing else): runs no file of the repository, only gh, on the plan's version
#   checked to be vX.Y.Z and the commit the push names. It tags that commit through the API and publishes the release
#   with --verify-tag. A tag already on this commit (a re-run after a failed publish) passes; one on any other commit
#   fails, as a release tag is never moved (the release-tags ruleset refuses that too). A release that exists already
#   isn't published again.
#
# One concurrency group, fleet-release, that waits instead of cancelling: two runs never overlap, so two never plan the
# same version. GitHub keeps one pending run per group, so a push while one run works and another waits replaces the
# waiting one; the newest commit's release then carries every merge since the last tag, and its notes list them all.
# It runs only on a push to this repository's main, from main's own files: no pull request's content or event reaches
# it, and every value reaches the shell through env, never through an expression in a script.
on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: fleet-release
  cancel-in-progress: false

# bash, which runs each step with -eo pipefail: a failed git or gh call fails the step instead of passing an empty
# result on.
defaults:
  run:
    shell: bash

jobs:
  check:
    name: make check
    if: github.repository == 'AnthonyPluth/fleet'
    runs-on: ubuntu-latest   # hosted: fleet's own CI, as fleet CI runs it
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
      # The oldest Python fleet_tools supports (pyproject.toml's requires-python), as fleet CI's.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0   # v7.1.0
        id: python
        with:
          python-version: "3.11"
      - name: Install Poetry
        env:
          PYTHON_PATH: ${{ steps.python.outputs.python-path }}
        run: pipx install --python "$PYTHON_PATH" "poetry==2.5.1"
      - name: make setup
        run: make setup
      # GH_TOKEN (read-only here) lets zizmor run its online audits too, as in fleet CI.
      - name: make check
        env:
          GH_TOKEN: ${{ github.token }}
        run: make check

  plan:
    name: Plan
    needs: check
    if: github.repository == 'AnthonyPluth/fleet'
    runs-on: ubuntu-latest   # hosted: the standard library and git only
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.next.outputs.version }}
      skip: ${{ steps.next.outputs.skip }}
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          fetch-depth: 0       # main's history and every tag, for the planner and the notes
          persist-credentials: false
      # Its outputs: newest, then version and new, or skip (true when this commit isn't main's newest any more and
      # isn't tagged yet, so nothing is released from it). -E and -s ignore PYTHON* variables and user site-packages
      # (-I would also drop the working directory from sys.path, and with it fleet_tools).
      - name: Work out the next version
        id: next
        env:
          SHA: ${{ github.sha }}
        run: /usr/bin/python3 -E -s -m fleet_tools.cli next-version --first-parent --fragments --sha "$SHA"
      # The notes start from the newest release tag in main's first-parent history before this commit: on a re-run
      # whose commit is tagged already, the tag before its own. They reach the release job as one base64 line, so no
      # entry can end the output or start another.
      - name: Write the notes
        id: notes
        if: steps.next.outputs.skip != 'true'
        env:
          SHA: ${{ github.sha }}
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          tag='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if ! [[ "$VERSION" =~ $tag ]]; then
            echo "::error::The planner's version '${VERSION:0:40}' isn't vX.Y.Z"
            exit 1
          fi
          previous=$(git describe --tags --abbrev=0 --first-parent --match 'v[0-9]*.[0-9]*.[0-9]*' "$SHA^")
          if ! [[ "$previous" =~ $tag ]]; then
            echo "::error::The previous release tag '${previous:0:40}' isn't vX.Y.Z"
            exit 1
          fi
          /usr/bin/python3 -E -s -m fleet_tools.cli release notes "${VERSION#v}" --since "$previous" --at "$SHA" > "$RUNNER_TEMP/notes.md"
          echo "The notes of $VERSION, since $previous:"
          cat "$RUNNER_TEMP/notes.md"
          echo "notes=$(base64 -w0 < "$RUNNER_TEMP/notes.md")" >> "$GITHUB_OUTPUT"

  release:
    name: Tag and release
    needs: plan
    if: github.repository == 'AnthonyPluth/fleet' && needs.plan.outputs.skip != 'true'
    runs-on: ubuntu-latest   # hosted: holds the contents: write token that creates the tag
    timeout-minutes: 5
    permissions:
      contents: write          # create the tag and the release
    steps:
      - name: Check the plan
        id: plan
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          NOTES: ${{ needs.plan.outputs.notes }}
        run: |
          if ! [[ "$VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::The plan's version '${VERSION:0:40}' isn't vX.Y.Z"
            exit 1
          fi
          if ! [[ "$NOTES" =~ ^[A-Za-z0-9+/]+=*$ ]]; then
            echo "::error::The plan's notes aren't one base64 line"
            exit 1
          fi
          base64 -d <<< "$NOTES" > "$RUNNER_TEMP/notes.md"
          if [[ ! -s "$RUNNER_TEMP/notes.md" ]]; then
            echo "::error::The plan's notes are empty"
            exit 1
          fi
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"
      # Re-runnable: a tag already on this commit (from a run whose publish failed) passes; one on any other commit fails.
      - name: Tag the commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          if existing=$(gh api "repos/$REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha' 2>/dev/null); then
            if [[ "$existing" != "$SHA" ]]; then
              echo "::error::$TAG exists already on $existing: a release tag is never moved. The next merge to main releases the next version."
              exit 1
            fi
            echo "$TAG is already on $SHA; not tagging again"
          else
            gh api "repos/$REPOSITORY/git/refs" -f "ref=refs/tags/$TAG" -f "sha=$SHA" --silent
            echo "Tagged $SHA as $TAG"
          fi
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            echo "The release $TAG exists already; not publishing again"
          else
            gh release create "$TAG" --repo "$REPOSITORY" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
          fi
