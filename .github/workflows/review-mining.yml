name: Review mining

# The monthly report of review findings that repeat (FLEET-MINING): the rule "a mistake that repeats gets a check"
# needs someone to notice repeats, and this job notices them without a model. It lists the pull requests updated in the
# window, reads the "Agent review" and "Second review" comments github-actions[bot] left on them, decodes only the
# third hidden line of each (the findings record agent-review.yml writes: severity, kind, title, file and the check
# the reviewer named; everything else in a comment quotes untrusted pull request content and is never read), and
# counts, per kind of the repository's AGENTS.md "Mistakes that keep coming back" item (and per normalized title for
# `other`), the pull requests with at least one finding. One issue per repository, "Repeated review findings" (label
# `review-mining`), is kept open and rewritten each run: a table of kind, state, pull requests, last seen and the
# proposed check, and below it one checkbox line per row, "becomes an Agent task", with a stable `row:` id, whose tick
# and link survive the rewrite (FLEET-MINING-TASKS opens the issues). The same table goes to the job summary.
# FLEET-MINING-SIGNALS adds three tables in the same row shape: from the fourth hidden line of the same comments (the
# outcomes record) and the owner's `/fleet dismiss` comments, the kinds mostly dismissed and the findings still open
# when their pull request merged; and, where the default branch sets [tool.fleet.verification], the `not verified`
# rows of the verification records of the pull requests merged in the window (parsed as data by
# fleet_tools/verification.py, never run), grouped by the verification guides' areas.
# `fleet_tools/review_mine.py` decides it all; docs/review-mining.md explains the report.
# FLEET-LOOP-STATS measures whether the loop turns: before the report is rewritten, `fleet loop-stats`
# (fleet_tools/loop_stats.py, docs/loop-stats.md) counts, over the last `loop-stats-days` days, the merged pull requests'
# reviews and what became of their findings, their verification records, the report's rows and the issues opened from
# them, and the harness changes on the default branch (read with the API: commits and file contents, never run). Its
# Markdown goes to the job summary, its JSON is uploaded as the `loop-stats.json` artifact (kept 90 days) and given to
# `review-mine --stats`, which puts a "Loop health" section at the top of the issue beside the last run's numbers, kept
# in a hidden `<!-- loop-stats <base64 JSON> -->` second line that is read back under a strict schema and size cap.
#
# The caller schedules it monthly (`17 6 1 * *`) or weekly (`17 6 * * 1`; the issue is rewritten either way) and may
# run it by hand. No secrets: the workflow's own token, with `issues: write` for the one issue, `pull-requests: read`
# for the list of pull requests and `contents: read` for the caller's AGENTS.md, pyproject.toml and Markdown files and
# the default branch's commits and files the loop stats read.
# Titles, kinds, checks, dismissal reasons and verification cells are defused and cut short before posting (no
# @mentions, no HTML comments, no tags), as the reviews' comments are.
on:
  workflow_call:
    inputs:
      days:
        description: The window, in days before the run, that a pull request must have been updated in to count.
        type: string
        default: "90"
      loop-stats-days:
        description: The loop stats' window, in days before the run (the merged pull requests, closed task issues and harness commits it counts).
        type: string
        default: "30"
      dry-run:
        description: Print the issue that would be opened or rewritten instead of posting it (the job summary and the loop-stats artifact are still produced).
        type: boolean
        default: false
      fleet-ref:
        description: The fleet ref to fetch the tool from (the self-test passes its own commit).
        type: string
        default: ""
    outputs:
      loop-stats-url:
        description: The link to the run's `loop-stats.json` artifact.
        value: ${{ jobs.mine.outputs.loop-stats-url }}

env:
  FLEET_REF: v2.0.0   # stamped by the release

permissions: {}

# bash, which runs each step with -eo pipefail: a command that fails inside a pipeline fails the step.
defaults:
  run:
    shell: bash

jobs:
  mine:
    name: Review mining
    runs-on: ubuntu-latest   # hosted: holds the write token for the issue; a few API reads and one write
    timeout-minutes: 15
    outputs:
      loop-stats-url: ${{ steps.upload.outputs.artifact-url }}
    permissions:
      contents: read           # the caller's AGENTS.md, pyproject.toml and verification guides; the default branch's commits and files
      issues: write            # the "Repeated review findings" issue (and reading the comments)
      pull-requests: read      # the pull requests updated in the window
    steps:
      # The default branch's AGENTS.md, for each kind's state (checked, partly checked, human-judged), and its
      # pyproject.toml and Markdown files, for [tool.fleet.verification] and the verification guides it names. Only
      # read as text: nothing of the caller's runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        id: app
        with:
          path: app
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: |
            AGENTS.md
            pyproject.toml
            *.md
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # fleet at the pinned ref: the tool, run from its own checkout so nothing of the caller's is on its path.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        id: fleet
        with:
          repository: AnthonyPluth/fleet
          ref: ${{ inputs.fleet-ref || env.FLEET_REF }}
          path: .fleet
          sparse-checkout: |
            fleet_tools
            VERSION
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # The loop's numbers: Markdown to the job summary (the report's own summary leaves its Loop health section out, so
      # it shows once), JSON for the artifact and the report. A part it can't read is null in the JSON and listed under
      # "Not read", never zero; it fails only when it can't write its files, and then the job still ends red.
      - name: Measure the loop
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DAYS: ${{ inputs.loop-stats-days }}
          OUT: ${{ runner.temp }}/loop-stats
        run: |
          mkdir -p "$OUT"
          cd .fleet || exit 1
          python3 -E -s -m fleet_tools.cli loop-stats --repo "$REPO" --days "$DAYS" --app-root "$GITHUB_WORKSPACE/app" \
            --json "$OUT/loop-stats.json" --markdown "$OUT/loop-stats.md"
          cat "$OUT/loop-stats.md" >> "$GITHUB_STEP_SUMMARY"

      # The JSON alone, not zipped: with `archive: false` the artifact is named after the file (`loop-stats.json`).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        id: upload
        with:
          path: ${{ runner.temp }}/loop-stats/loop-stats.json
          archive: false
          retention-days: 90
          if-no-files-found: error

      # Whatever happened to the two steps above, but only when both checkouts succeeded: review-mine copes with a
      # missing or unreadable stats file (it warns and keeps last run's numbers), so a failed measurement or upload never
      # stops the report, and that failure still fails the job. Without the app's checkout, AGENTS.md's states and the
      # verification settings would be missing and the rewrite would drop the gaps and the unlinked ticks, so a failed
      # checkout leaves the last report as it is.
      - name: Rewrite the report
        if: ${{ !cancelled() && steps.app.outcome == 'success' && steps.fleet.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DAYS: ${{ inputs.days }}
          DRY_RUN: ${{ inputs.dry-run }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STATS: ${{ runner.temp }}/loop-stats/loop-stats.json
        run: |
          flags=()
          if [ "$DRY_RUN" = true ]; then flags+=(--dry-run); fi
          cd .fleet || exit 1
          python3 -E -s -m fleet_tools.cli review-mine --repo "$REPO" --days "$DAYS" \
            --agents-md "$GITHUB_WORKSPACE/app/AGENTS.md" --app-root "$GITHUB_WORKSPACE/app" \
            --summary "$GITHUB_STEP_SUMMARY" --stats "$STATS" "${flags[@]}"
