# actionlint 1.7.12, its newest release, doesn't know the job context's workflow_* properties yet, so it reports the
# `${{ job.workflow_sha }}` that fleet's checkouts use (the FLEET_REF convention in AGENTS.md) as undefined. GitHub
# documents it: https://docs.github.com/en/actions/reference/workflows-and-actions/contexts#job-context. Only that one
# message is ignored; delete this file once actionlint knows the property.
paths:
  .github/workflows/**/*.{yml,yaml}:
    ignore:
      - 'property "workflow_sha" is not defined in object type \{check_run_id: number; container: '
