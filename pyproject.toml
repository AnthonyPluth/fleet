[project]
name = "fleet"
version = "2.2.2"   # the same as VERSION (tests/test_cli.py checks it)
description = "Shared agent build safeguards: reusable workflows, checks and the Claude Code plugin"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.11"
dependencies = []   # standard library only, so a runner's system python3 runs it without Poetry

# `fleet screenshot-diff` is the one command that needs more: Pillow, as the optional extra `images`
# (`pip install "fleet[images]"`, which screenshot-diff.yml installs from fleet's checkout). Everything else stays standard library.
[project.optional-dependencies]
images = ["pillow>=12,<14"]

[project.scripts]
fleet = "fleet_tools.cli:main"

[tool.poetry]
packages = [{ include = "fleet_tools" }]
# The AGENTS.md sections and the files `fleet sync` vendors ship beside the package, so `fleet sync` at a version
# writes that version's text.
include = [
  { path = "agents-md/sections/*.md", format = ["sdist", "wheel"] },
  { path = "plugins/fleet/skills/**/*", format = ["sdist", "wheel"] },
  { path = "plugins/fleet/agents/*.md", format = ["sdist", "wheel"] },
  { path = "plugins/fleet/hooks/session-start.sh", format = ["sdist", "wheel"] },
  { path = "shim/fleet", format = ["sdist", "wheel"] },
]

# The tools `make check` and CI run, pinned so every run uses the same versions; Dependabot updates them here.
# actionlint isn't a Python package: `make setup` downloads its pinned binary (Makefile).
[tool.poetry.group.dev.dependencies]
ruff = "0.17.2"
mypy = "2.4.0"
coverage = "7.17.0"
zizmor = "1.31.1"
pillow = "13.0.0"   # the `images` extra, pinned for the tests of fleet_tools/screenshot_diff.py

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "UP", "SIM", "RUF", "I"]

[tool.mypy]
python_version = "3.11"
files = ["fleet_tools", "tests"]
exclude = ["^tests/fixtures/"]   # the fixture consumers' own Python, which mypy would see as duplicate modules
strict = true

[tool.coverage.run]
source = ["fleet_tools"]
